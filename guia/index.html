<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuKatum Guia</title>
<meta name="robots" content="noindex">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* BuKatum · base de dados. Cartas de personagem com borda da raridade, fonte de jogo nos títulos. */
:root {
  --bg: #eef0f7; --surface: #ffffff; --ink: #1d1a2e; --dim: #66627c; --line: #d9dbe8; --tile: #e3e6f2;
  --raro: #3f8cff; --epico: #a04dff; --lendario: #e8a400; --boss: #e0432f; --accent: #ff8a1f; --ok: #1fa86b;
  --display: "Lilita One", "Arial Black", sans-serif; --body: "Nunito", "Segoe UI", sans-serif; --mono: "JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15131f; --surface: #1f1c2c; --ink: #f1eefb; --dim: #a39fb8; --line: #322e44; --tile: #2a2639; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #15131f; --surface: #1f1c2c; --ink: #f1eefb; --dim: #a39fb8; --line: #322e44; --tile: #2a2639; color-scheme: dark }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
a { color: inherit; }
code { font-family: var(--mono); font-size: 12px; background: var(--tile); border-radius: 4px; padding: 1px 5px; }
.dim { color: var(--dim); }
.mono { font-family: var(--mono); font-size: 12px; color: var(--dim); }
.kicker { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* topo fixo com as abas */
.topo { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topo-in { max-width: 1240px; margin: 0 auto; padding: 8px max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 14px; }
.marca { font-family: var(--display); font-size: 24px; text-decoration: none; white-space: nowrap; }
.marca span, .hero h1 span { color: var(--accent); }
.abas { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.abas::-webkit-scrollbar { display: none; }
.abas a { text-decoration: none; font-weight: 800; font-size: 14px; padding: 6px 12px; border-radius: 999px; white-space: nowrap; color: var(--dim); }
.abas a:hover { color: var(--ink); background: var(--tile); }
.abas a.on { background: var(--ink); color: var(--bg); }

main { max-width: 1240px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 72px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 36px; }
.sec { min-width: 0; }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.05; text-wrap: balance; }
h2 { font-size: 30px; margin-bottom: 4px; }
h3 { font-size: 22px; }
h4 { font-size: 18px; }
.sec-sub { color: var(--dim); margin: 0 0 16px; max-width: 75ch; }
.hero h1 { font-size: clamp(44px, 8vw, 76px); line-height: .95; }
.hero p { color: var(--dim); max-width: 64ch; margin: 10px 0 0; }
.counts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.counts a { text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 800; }
.counts a b { font-family: var(--display); font-weight: 400; color: var(--accent); margin-right: 6px; font-size: 17px; }
.fonte { font-family: var(--mono); font-size: 11px; color: var(--dim); border: 1px dashed var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.nota { color: var(--dim); font-size: 14px; margin: 12px 0 0; }

/* chips e selos */
.badge { display: inline-block; background: var(--c, var(--dim)); color: #fff; font-weight: 800; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; border-radius: 6px; padding: 2px 8px; vertical-align: middle; }
.badge.raro { --c: var(--raro); } .badge.epico { --c: var(--epico); } .badge.lendario { --c: var(--lendario); } .badge.boss { --c: var(--boss); }
.badge.rev { --c: var(--accent); } .badge.agora { --c: var(--ok); } .badge.ideia { --c: var(--dim); margin-top: 6px; }
.poder, .equip { background: var(--lendario); color: #fff; font-family: var(--body); font-size: 10px; font-weight: 800; text-transform: uppercase; border-radius: 4px; padding: 1px 5px; vertical-align: middle; letter-spacing: .04em; }
.equip { background: var(--raro); }
.chip { font: inherit; font-weight: 800; font-size: 13px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 12px; }
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.golpe.esp { border-color: var(--accent); }
.chip.golpe:active { transform: scale(0.96); }
.marco { display: inline-block; background: var(--tile); border-radius: 6px; padding: 1px 7px; margin: 0 4px 4px 0; font-size: 13px; }
.bar { height: 8px; background: var(--tile); border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.prog { font-family: var(--mono); font-size: 12px; color: var(--dim); }

/* tabelas */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 800; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 12px; border-bottom: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
td .bar { width: 120px; display: inline-block; vertical-align: middle; margin: 0 8px 0 0; }
td img.ic { width: 22px; height: 22px; object-fit: contain; vertical-align: middle; margin-right: 6px; }
details { margin-top: 10px; }
summary { cursor: pointer; font-weight: 800; color: var(--accent); margin-bottom: 8px; }
details .tbl-wrap { max-height: 420px; overflow-y: auto; }

/* início */
.agora-card { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--lendario); border-radius: 16px; padding: 16px; }
.agora-card:hover { border-color: var(--accent); }
.strip { display: grid; grid-template-columns: repeat(4, 1fr); background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--lendario) 25%, var(--tile)), var(--tile) 70%); border-radius: 12px; align-self: start; }
.strip figure { margin: 0; position: relative; aspect-ratio: 4/5; }
.strip img { width: 100%; height: 100%; object-fit: contain; }
.strip figcaption, .fotos figcaption { position: absolute; left: 6px; bottom: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; background: var(--surface); border-radius: 999px; padding: 1px 8px; }
.link { display: inline-block; margin-top: 10px; font-weight: 800; color: var(--accent); }
.todo { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 6px; }
.todo li { color: var(--dim); }
.todo li b { font-family: var(--body); font-weight: 800; color: var(--ink); }
.todo li.ok b { color: var(--ok); }
.todo li.ok b::before { content: "✓ "; }
.steps { display: grid; gap: 10px; counter-reset: s; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 14px 60px; position: relative; }
.step::before { counter-increment: s; content: counter(s); position: absolute; left: 18px; top: 10px; font-family: var(--display); font-size: 30px; color: var(--accent); }
.step b { font-family: var(--display); font-weight: 400; font-size: 19px; }
.checks { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
.checks li { font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--dim); }
.checks li.ok { border-color: var(--ok); color: var(--ink); }
.checks li.ok::before { content: "✓ "; color: var(--ok); font-weight: 800; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.rule { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.rule b { font-family: var(--display); font-weight: 400; font-size: 19px; display: block; margin-bottom: 4px; }
.formula { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 10px; padding: 12px 14px; }

/* grade de personagens */
.filtros { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.pcard { --c: var(--dim); text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--c); border-radius: 14px; overflow: hidden; display: grid; transition: transform .12s; }
.pcard:hover { transform: translateY(-3px); border-color: var(--c); }
.pcard.raro, .phead.raro, .palco-box.raro { --c: var(--raro); } .pcard.epico, .phead.epico, .palco-box.epico { --c: var(--epico); } .pcard.lendario, .phead.lendario, .palco-box.lendario { --c: var(--lendario); }
.pfoto { position: relative; aspect-ratio: 1; background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c) 28%, var(--tile)), var(--tile) 70%); }
.pfoto img { width: 100%; height: 100%; object-fit: contain; }
.pforma { position: absolute; left: 8px; top: 8px; background: var(--epico); color: #fff; font-size: 11px; font-weight: 800; border-radius: 999px; padding: 1px 8px; }
.pinfo { padding: 10px 12px 12px; display: grid; gap: 3px; }
.pinfo h3 { font-size: 20px; margin-top: 4px; }
.selos { display: flex; flex-wrap: wrap; gap: 4px; }
.mini-stats { display: flex; gap: 10px; font-family: var(--mono); font-size: 12px; color: var(--dim); margin-top: 4px; flex-wrap: wrap; }

/* ficha do personagem */
.voltar { text-decoration: none; font-weight: 800; color: var(--dim); margin-bottom: -24px; }
.voltar:hover { color: var(--accent); }
.phead h1 { font-size: clamp(34px, 5.5vw, 54px); margin: 6px 0 4px; }
.perso { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 28px; align-items: start; }
.palco-col { position: sticky; top: 66px; display: grid; gap: 10px; }
.palco-box { --c: var(--accent); position: relative; border-radius: 16px; border: 1px solid var(--line); background: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--c) 30%, var(--tile)), var(--tile) 72%); overflow: hidden; }
.palco { aspect-ratio: 1 / 1.05; width: 100%; touch-action: none; }
.palco3d { width: 100% !important; height: 100% !important; display: block; cursor: grab; }
.palco3d:active { cursor: grabbing; }
.sem3d { display: grid; place-items: center; height: 100%; color: var(--dim); font-weight: 800; }
.legenda3d { position: absolute; left: 10px; bottom: 10px; right: 10px; font-size: 12px; font-weight: 800; background: color-mix(in srgb, var(--surface) 85%, transparent); border-radius: 8px; padding: 3px 9px; width: fit-content; max-width: calc(100% - 20px); }
.ctrl { display: grid; gap: 8px; }
.ctrl-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.fotos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.fotos figure { margin: 0; position: relative; aspect-ratio: 4/5; background: var(--tile); border-radius: 10px; overflow: hidden; }
.fotos figure.larga { grid-column: span 2; grid-row: span 2; aspect-ratio: auto; }
.fotos img { width: 100%; height: 100%; object-fit: contain; }
.ficha { display: grid; gap: 30px; min-width: 0; }
.subnav { position: sticky; top: 58px; z-index: 5; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; background: var(--bg); padding: 8px 0; border-bottom: 1px solid var(--line); }
.subnav a { text-decoration: none; font-weight: 800; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); white-space: nowrap; }
.subnav a:hover { border-color: var(--accent); color: var(--accent); }
.ficha .sec { scroll-margin-top: 110px; }
.acoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.acao { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 3px; align-content: start; }
.acao b { font-family: var(--display); font-weight: 400; font-size: 19px; }
.acao.esp { border-left: 5px solid var(--epico); }
.itens-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.item-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; align-content: start; }
.item-card.vazio { border-style: dashed; background: transparent; }
.item-top { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; }
.item-ic { width: 56px; height: 56px; border-radius: 12px; background: var(--tile); display: grid; place-items: center; overflow: hidden; }
.item-ic img { width: 100%; height: 100%; object-fit: contain; }
.inicial { font-family: var(--display); font-size: 26px; color: var(--dim); }
dl { display: grid; grid-template-columns: 80px 1fr; gap: 6px 10px; margin: 0; font-size: 14px; }
dt { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); padding-top: 3px; }
dd { margin: 0; min-width: 0; }
.ver { justify-self: start; }
.formas { display: grid; gap: 10px; }
.forma { display: grid; grid-template-columns: 110px 1fr; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.forma.vazio { grid-template-columns: 1fr; border-style: dashed; background: transparent; }
.forma-foto { background: var(--tile); }
.forma-foto img { width: 100%; height: 100%; object-fit: contain; }
.forma-info { padding: 12px 14px 12px 0; display: grid; gap: 5px; align-content: start; }
.forma.vazio .forma-info { padding-left: 14px; }
.aura-cores { display: flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 800; color: var(--dim); }
.aura-cores i, .paleta i { width: 18px; height: 18px; border-radius: 5px; display: inline-block; border: 1px solid rgba(0,0,0,.15); }
.upar, .onde, .modelos-forma { display: grid; gap: 12px; }
.upar-bloco { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.upar-bloco p { margin: 0; }
.upar-bloco .tbl-wrap { border-radius: 10px; }
.calc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 18px; }
.calc label { display: grid; gap: 4px; font-weight: 800; font-size: 13px; }
.calc output { font-family: var(--mono); color: var(--accent); }
.calc input[type=range] { width: 100%; accent-color: var(--accent); }
.calc select { font: inherit; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.calc-res { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.calc-res div { background: var(--tile); border-radius: 10px; padding: 8px 10px; display: grid; }
.calc-res span { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 800; color: var(--dim); }
.calc-res b { font-family: var(--display); font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums; }
.calc-res small { font-family: var(--mono); color: var(--dim); }
.paleta { display: flex; flex-wrap: wrap; gap: 4px; }
.paleta.grande span { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; font-size: 13px; }
.nomes { display: flex; flex-wrap: wrap; gap: 5px; }
.nomes span { font-family: var(--mono); font-size: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }

/* mundo, evento */
.zonas { display: grid; gap: 10px; }
.zona { display: grid; grid-template-columns: 56px 1fr; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-left: 8px solid var(--z); border-radius: 14px; padding: 12px 14px; }
.zona-n { font-family: var(--display); font-size: 40px; color: var(--z); line-height: 1; }
.zona-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.zona-item { display: flex; align-items: center; gap: 8px; background: var(--tile); border-radius: 10px; padding: 6px 10px 6px 6px; text-decoration: none; font-size: 14px; }
.zona-item img { width: 48px; height: 56px; object-fit: contain; }
.ovo-ic { width: 34px; height: 42px; border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%; display: inline-block; flex: none; background: radial-gradient(circle at 30% 35%, var(--b) 0 12%, transparent 13%), radial-gradient(circle at 68% 62%, var(--b) 0 10%, transparent 11%), var(--a); border: 2px solid rgba(0,0,0,.15); }
.zona-item.ovo { padding-left: 10px; }
.ovos { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.ovo-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.ovo-card header { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.pool { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.pool a { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; text-decoration: none; padding: 2px 6px 2px 2px; border-radius: 8px; }
.pool a:hover { background: var(--tile); }
.pool img { width: 34px; height: 40px; object-fit: contain; }
.minis { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; margin-bottom: 12px; }
.mini { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; padding-right: 12px; overflow: hidden; text-decoration: none; }
.mini:hover { border-color: var(--accent); }
.mini .shot { margin: 0; background: var(--tile); aspect-ratio: 4/5; }
.mini .shot img { width: 100%; height: 100%; object-fit: contain; }
.mini h4 { font-size: 18px; }

/* galeria de modelos */
.grupo { margin: 18px 0 10px; }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.mcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; text-decoration: none; display: grid; gap: 2px; padding-bottom: 8px; text-align: center; }
.mcard:hover { border-color: var(--accent); }
.mcard b { font-size: 13px; padding: 0 6px; }
.mfoto { aspect-ratio: 5/6; background: var(--tile); }
.mfoto img { width: 100%; height: 100%; object-fit: contain; }

@media (max-width: 900px) {
  .perso { grid-template-columns: 1fr; }
  .palco-col { position: static; }
  .palco { aspect-ratio: 1 / 1; }
  .agora-card { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  .marca { font-size: 20px; }
  .strip { grid-template-columns: repeat(2, 1fr); }
  .pgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .pinfo h3 { font-size: 17px; }
  .forma { grid-template-columns: 84px 1fr; }
  dl { grid-template-columns: 1fr; }
  dt { padding-top: 0; }
  .mini { grid-template-columns: 76px 1fr; }
}

/* classes da equipe (SummonData.Classes) */
.badge.cls-DPS { background: #ff5a46; color: #1a1414; }
.badge.cls-Suporte { background: #5adc8c; color: #102016; }
.badge.cls-Farm { background: #ffc83c; color: #221a06; }
.subt { margin: 22px 0 10px; font-size: 1.05rem; }
.pgrid.guardados { opacity: .6; }

/* itens feitos recolhidos nas etapas */
.feitos{margin-top:8px}
.feitos summary{cursor:pointer;color:var(--dim,#9a96b8);font-weight:700;font-size:14px;padding:4px 0}
.feitos summary:hover{color:inherit}
</style>
</head>
<body>
<header class="topo"><div class="topo-in"><a class="marca" href="#inicio">Bu<span>Katum</span></a><nav class="abas" id="abas" aria-label="Abas"></nav></div></header>
<main id="conteudo"></main>

provado","Animações","Itens próprios (4 itens, +0 a +99)","Visual dos equipamentos","Auras de cada forma","Itens de evolução de cada forma","Raid onde cada item cai","Balanceamento","Efeitos e sons dos golpes","No jogo e testado","Guia atualizado"]},"personagem_atual":{"id":"Kakaroto","nome":"Kakaroto","comecou":"2026-10-17","passos":[{"nome":"Modelo de todas as formas aprovado","feito":true,"obs":"Criança → SSJ → SS3 → SS4, aprovados em 17/10"},{"nome":"Animações","feito":true,"obs":"Cena de transformação APROVADA (18/10): noite, carga com pedras e raios, clarão, troca de forma, onda de choque e nome na tela (~8 s, clique pula). Parado APROVADO (18/10): Guarda Saiyajin e, a cada ~8 s, Juntando ki por 2 s. Andar ESCOLHIDO (18/10): opção 2 \"Caminhada natural\", com a passada no ritmo da velocidade (mais lenta e fluida, entra e sai suave). Golpe e especial APROVADOS (18/10): combo de 3 (socos → ki → kamehameha pequeno) + barra do especial com clique; a partir do SSJ teletransporta até o inimigo; especial com pulo: Genki Dama (criança), Kamehameha (SSJ), Super Kamehameha (SS3, maior e mais longo), Kamehameha vermelho com dragão (SS4)."},{"nome":"Itens próprios (4 itens, +0 a +99)","feito":true,"obs":"Ki (poder, já vem), Aura (dano), Pesos de Luta (velocidade), Nuvem Voadora (alcance), com ícones. Despertar pede todos os itens no nível. Testado no Play; números ajustáveis no Balanceamento"},{"nome":"Visual dos equipamentos","feito":true,"obs":"Aprovados: Nuvem (todas as formas sentam de perna cruzada, rabo balançando e pedacinhos) e Pesos de Luta (4 blocos vermelhos 10t: pulsos e canelas). Aparecem com o item em +1. Montaria do jogador: botão NUVEM ou F monta e voa (WASD/analógico, E sobe, Q desce, F ou pular desce); não dá pra passar parede de zona trancada voando"},{"nome":"Auras de cada forma","feito":true,"obs":"Aprovada: cubinhos nascem no chão, sobem e somem + anel pulsando. Criança = ki branco (com o item Aura equipado), SSJ dourada, SS3 com faísca azul, SS4 vermelha. Mais nível no item Aura = mais cubinhos"},{"nome":"Itens de evolução de cada forma","feito":false,"obs":"Depois, quando o resto estiver pronto (decisão dele, 18/10). Hoje usa só Cristais de Despertar genéricos"},{"nome":"Raid onde cada item cai","feito":false,"obs":"Depois, quando o resto estiver pronto (decisão dele, 18/10)"},{"nome":"Balanceamento","feito":false,"obs":"Só quando os inimigos existirem (decisão dele, 18/10). Dano, preço em moedas, cristais e nível mínimo de cada forma; e o combo novo (socos ×1, ki ×1,2, kamehameha pequeno ×1,6) + barra de 8 golpes + especiais ×6/×5/×7/×9"},{"nome":"Efeitos e sons dos golpes","feito":true,"obs":"APROVADOS (18/10): socos com estalos, bola de ki grande, Kamehameha pequeno, Genki Dama (energia vindo de todo lado + explosão azul), Kamehamehas com pulo, dragão verde de blocos no SS4 e teletransporte com riscos de luz"},{"nome":"No jogo e testado","feito":false,"obs":"Modelos e especiais no Studio e testados no Play; falta publicar"},{"nome":"Guia atualizado","feito":false,"obs":"Marca no fim, com tudo pronto"}]},"etapas":[{"titulo":"7 campeões pra jogar e publicar","descricao":"Decisão dele (18/10): começar com 3 DPS, 3 Suportes e 1 Farm pra jogar e publicar logo; os outros 10 ficam guardados e voltam depois. Um por vez até o fim, como o Goku.","itens":[{"nome":"Goku (DPS)","feito":false},{"nome":"Luffy (DPS)","feito":false},{"nome":"Ichigo (DPS)","feito":false},{"nome":"Tony Tony Chopper (Suporte)","feito":false},{"nome":"Charmy Pappitson (Suporte)","feito":false},{"nome":"Orihime Inoue (Suporte)","feito":false},{"nome":"Nami (Farm)","feito":false}]},{"titulo":"Base: Aincrad com NPCs","descricao":"Ideia dele (18/10): a base é o Aincrad (Sword Art Online) voando no céu do mundo — do chão dá pra ver ele por baixo e um portal leva pra cima. Dentro: um jardim grande com a torre no meio, como se fosse a subida pro próximo andar. Dentro dele ficam os NPCs: o Greed (Grid, de Overgeared) é o ferreiro e cuida só dos equipamentos; a Norma Selner (a \"senhorita Selene\" de Solo Leveling) cuida das passivas (rolar e melhorar). O Greed saiu da fila de campeões e virou NPC; o Chopper continua como suporte de buff. Novo NPC (18/10): Echidna, a Bruxa da Ganância (Re:Zero), na mesa de chá do jardim — cuida do Livro da Sabedoria (o livro de tudo: inimigos, chefes, recompensas por completar) e do Renascer dos campeões.","itens":[{"nome":"Tudo no Studio: Aincrad voando no céu do mundo, jardim com a torre, forja do Greed, escritório da Selner e chá da Echidna","feito":true},{"nome":"Modelo do Greed (ferreiro) — opção 1: armadura de Pagma vermelha e dourada + martelo","feito":true},{"nome":"Aincrad por fora — opção 2 (andares de aço com janelas acesas, disco com torres, raízes de pedra)","feito":true},{"nome":"Aincrad por dentro — opção 2: jardim real (alamedas em estrela, sebes em anéis, canteiros e fontes) com a torre de subida no meio","feito":true},{"nome":"Cabaninha da forja do Greed — opção 3: cabaninha de pedra (meia parede, telhado vermelho, chaminé de pedra, placa do martelo)","feito":true},{"nome":"Portal no chão do Vale (perto do spawn) que leva pro jardim, e o portal do jardim que volta — no Studio e testado","feito":true},{"nome":"Forja do Greed: \"Fortalecer itens\" sai da tela EQUIPE e vai pro NPC (prompt \"Forjar\" abre a FORJA DO GREED; longe dele o botão vira \"VÁ NA FORJA\" e o servidor recusa)","feito":true},{"nome":"Animação da forja e do Greed: ele martela a peça em brasa (3 marteladas e vira a peça) com faísca e som de bigorna; fogo na fornalha com luz tremendo, brasas subindo e fumaça na chaminé; quando alguém fortalece: 3 marteladas fortes e estouro dourado (sucesso) ou fumaça (falhou)","feito":true},{"nome":"Greed: EVOLUIR equipamentos — estágios Comum → Raro (+20) → Épico (+40) → Lendário (+60) → Mítico (+80), com gemas + essências; cada estágio multiplica o bônus do item (×1,15 / ×1,3 / ×1,5 / ×1,75) e melhora a chance da passiva","feito":true},{"nome":"Greed: MODIFICAR equipamentos — 1 passiva por equipamento, separada do fortalecer (fortalecer = bônus base; passiva = % de uma coisa específica), com raridade (Comum a Mítico): Queimadura (dano contínuo 3 s), Quebra-Escudo (dano a escudo), Caçador de Chefes (dano em chefe), Afiado (dano), Certeiro (crítico), Ligeiro (velocidade), Olho de Águia (alcance), Golpe Final (especial), Ganância (+moedas da equipe); se já tinha, escolhe ficar com a nova ou manter a antiga. O Poder não evolui nem ganha passiva","feito":true},{"nome":"FORTALECER = só dano base em todo item (poder e equipamento): +1% de dano por nível e marcos +30/+60/+99 dão +5/+10/+15% de dano extra. Velocidade, alcance, crítico e especial agora só vêm das passivas","feito":true},{"nome":"Cantinhos do jardim (forja, escritório da Selner, chá da Echidna) virados pro centro/torre, casas ×1,8 maiores, NPCs e móveis ×1,5 (NPC = 7,5 studs, 1,5× o jogador; modelos padrão em UnitModels também) e sebe da frente aberta pra entrar","feito":true},{"nome":"Chefes com ESCUDO (35% da vida, barra azul por cima da vida) no mundo e no evento de defesa — apanha antes da vida; inimigo queimando pega fogo","feito":true},{"nome":"Modelo da Norma Selner — opção 2: chapéu bege enorme com laço, cabelão cacheado, terninho bege de saia longa, gravata-laço azul","feito":true},{"nome":"Cantinho da Selner no jardim — opção 5: escritório do Bureau (pérgola, escrivaninha, abajur, arquivo, globo de cristal)","feito":true},{"nome":"Sistema de passivas da Selner (prompt \"Passivas\"): 1 vaga por campeão (a Marca da Bruxa abre mais, até 4); ROLAR = 40 gemas; 14 passivas com raridade própria — Comum 45% (Vigor, Agilidade, Visão), Raro 30% (Fúria, Ímpeto, Precisão), Épico 17,5% (Caçador Rank S, Rajada de Mana, Chamas Negras), Lendário 6% (Monarca, Quebra-Limite, Destruidor), Mítico 1,5% (Soberano das Sombras, Ganância Absoluta); Lendária garantida a cada 40 rolagens; nova × antiga igual à forja","feito":true},{"nome":"Modelo da Echidna — opção 2: com a xícara <script>
// Movimentos e golpes no 3D da ficha de cada personagem (os botões embaixo do boneco).
// É cópia do jogo (F:\padrao\anime-td\src\StarterPlayer\StarterPlayerScripts):
//   corpo   = UnitAnim.client.luau (parado, andar, estilos de golpe, poses dos especiais, pulo)
//   efeitos = AttackFx.client.luau (bola de ki, socos, Kamehamehas, Genki Dama, dragão, cortes...)
// O visualizador (V3, no app.js) chama controlador.passo(dt, api) a cada quadro e aplica a pose
// que ele devolve; `api` dá a posição das peças, põe coisas na cena, faz o pulo e a câmera de lado.
// Mudou golpe no jogo? Mudar aqui também (mesmos números).
"use strict";
const GOLPES3D = (() => {
  const W = (2 * Math.PI) / 3; // uma volta em 3 s (parado do Kakaroto)
  const sn = (t, k, ph = 0) => Math.sin(W * k * t + ph);
  const lerp = (a, b, t) => a + (b - a) * t;
  function curve(keys, p) { // curva por trechos suavizada (igual ao UnitAnim)
    for (let i = 1; i < keys.length; i++) {
      if (p <= keys[i][0]) {

    function socosFx(to, hits, time) {

    function zera() { for (const o of objs) st.api && st.api.remove(o); objs.clear(); st.atk = null; st.pose = null; st.noAr = false; st.jump = null; st.fx = []; st.timers = []; st.gen++; st.ocupado = false; }

// Inimigos do campo no 3D (Soldados Pó e Guardiões do Dragão): andar, golpes, especiais, entrada de
// herói e virar pó. Cópia do jogo (F:\padrao\anime-td\src):
//   corpo   = StarterPlayerScripts/EnemyAnim.client.luau (poses Ergue/Corte/Estoca/Mira/Chute/Carga/Sentai, suavizadas)
//   golpes  = ServerScriptService/MundoServer.server.luau (golpeInimigo e ESPECIAIS: tempos e alcances)
//   efeitos = StarterPlayerScripts/MundoUI.client.luau (InimigoFx e EliteFx)
// Mesmo formato do GOLPES3D (tools/golpes3d.js): o V3 chama passo(dt, api) e aplica a pose devolvida.
// O alvo dos golpes é um campeão (V3.inimigo("Kakaroto_SSJ")), que balança quando apanha.
"use strict";
const INIMIGOS3D = (() => {
  const lerp = (a, b, t) => a + (b - a) * t;

  const POSES = {
    Aponta: { V: 22, BracoD: 85 },
    Soco: { V: 30, BracoD: 95, BracoE: -25 },
    Ergue: { V: 14, BracoD: 165, BracoE: -20, PernaD: -12, PernaE: 10 },
    Corte: { V: 40, BracoD: 30, BracoE: -35, PernaD: 18, PernaE: -14 },
    Estoca: { V: 36, BracoD: 92, BracoE: 45, PernaD: 22, PernaE: -18 },
    Mira: { V: 20, BracoE: 90, BracoD: 78 },
    Chute: { V: 38, PernaD: 85, PernaE: -10, BracoD: -40, BracoE: 40 },
    Carga: { V: 10, BracoD: -35, BracoE: -35, PernaD: -15, PernaE: 15 },
    Sentai: { V: 12, BracoD: 170, BracoE: 55, PernaD: -20, PernaE: 12 },
  };
  const STRIDE = 2.6;

  function controlador(id, info) {
    const elite = !!info.Especial, cor = info.Cor || "#ffffff";
    const st = { t: 0, ph: Math.random() * 6, modo: "parado", luta: false, pose: null, cur: {}, fx: [], timers: [], gen: 0,
      ocupado: false, api: null, alvo: null, boneco: null, D: 10, z: 0, vel: 0, hitAt: -9, escala: 1 };
    let T;
    const espera = (s) => new Promise((res) => st.timers.push({ at: st.t + s, res }));
    function anima(dur, fn) {
      return new Promise((res) => { let e = 0; st.fx.push((dt) => { e += dt; const a = Math.min(e / dur, 1); fn(a); if (a >= 1) { res(); return false; } return true; }); });
    }

    const V = (x, y, z) => new T.Vector3(x, y, z);
    const objs = new Set();
    function poe(o) { objs.add(o); return st.api.add(o); }
    function sai(o) { objs.delete(o); st.api.remove(o); }
    function mat(c, opac = 1) { return new T.MeshBasicMaterial({ color: c, transparent: true, opacity: opac, depthWrite: opac > 0.95 }); }
    function bola(pos, diam, c, opac = 0.95) { const m = new T.Mesh(new T.SphereGeometry(0.5, 18, 12), mat(c, opac)); m.position.copy(pos); m.scale.setScalar(diam); return poe(m); }
    function caixa(s, c, opac = 1) { return poe(new T.Mesh(new T.BoxGeometry(s[0], s[1], s[2]), mat(c, opac))); }

      const r = new T.Mesh(new T.CylinderGeometry(1, 1, 0.15, 36, 1, true), mat(c, opac)); r.material.side = T.DoubleSide;
      r.position.set(pos.x, 0.1, pos.z); poe(r);

    }

      const d = new T.Mesh(new T.CircleGeometry(1, 36), mat(c, opac)); d.rotation.x = -Math.PI / 2; d.position.set(pos.x, 0.06, pos.z); d.scale.setScalar(raio); return poe(d);
    }

    }
    // câmera de lado enquadrando o inimigo (que sai de z = 0) e o alvo; "largo" pros especiais grandes
    function camera(largo) {
      const { camera: cam, controls } = st.api, longe = info.Alcance > 8, larg = st.D + (largo ? 7 : 3.5) + (longe ? 2 : 0), alt = largo ? 10 : 6;
      const pal = document.querySelector("#palco"), asp = pal && pal.clientHeight ? pal.clientWidth / pal.clientHeight : cam.aspect; // o palco pode ter acabado de mudar (gravação 16:9)
      const tv = Math.tan((cam.fov * Math.PI) / 360), d = Math.max(larg / 2 / (tv * asp), alt / 2 / tv) * 1.02;
      const zc = -st.D / 2 + (longe ? 0.6 : -0.6), ty = largo ? 3.2 : 2.3;

    }
    function entraLuta() {

    }
    const gp = () => st.api.grupo().position.clone();
    function ponto(...nomes) { for (const n of nomes) { const p = st.api.ponto(n); if (p) return p; } return gp().add(V(0, 2.4, -0.6)); }
    function pose(nome, ate) { st.pose = nome; if (ate) { const g = st.gen; espera(ate).then(() => { if (vivo(g) && st.pose === nome) st.pose = null; }); } }
    const alvoPe = () => V(0, 0, -st.D);

    // anda até ficar a `gap` do alvo (passos no ritmo da velocidade)
    async function chega(gap) {
      const g = st.gen, fim = -(st.D - gap);
      if (st.z <= fim + 0.05) return;
      const dur = (st.z - fim) / info.Vel;
      const z0 = st.z;
      st.vel = info.Vel;
      await anima(dur, (a) => { st.z = lerp(z0, fim, a); st.api.desloca(st.z); });
      st.vel = 0;
      if (!vivo(g)) return;
    }

    // ---- efeitos (MundoUI)
    function corteFx(c = "#ffffff") { // meia-lua de cima pra baixo na frente do alvo
      const centro = st.alvo.clone().add(V(0, 0, 1.1));
      const grupo = new T.Group(); grupo.position.copy(centro); grupo.rotation.z = (Math.random() - 0.5) * 1.1; poe(grupo);
      for (let i = 0; i < 9; i++) {
        const ang = (-70 + i * 17.5) * Math.PI / 180;
        const m = new T.Mesh(new T.BoxGeometry(0.2, 0.7, 0.3 + (1 - Math.abs(i - 4) / 4) * 0.3), mat(i % 2 ? c : "#ffffff", 0.95));
        // arco de pé no plano do ataque (a câmera de lado vê a meia-lua)
        m.position.set(0, Math.cos(ang) * 1.6 - 1, -Math.sin(ang) * 1.6); m.rotation.x = -ang;
        m.visible = false; grupo.add(m);
        espera(i * 0.012).then(() => { m.visible = true; });
      }
      anima(0.28, (a) => grupo.children.forEach((m) => { m.material.opacity = 0.95 * (1 - a); m.scale.set(1 - 0.6 * a, 1 + 0.4 * a, 1 - 0.6 * a); })).then(() => { grupo.children.forEach((m) => { m.geometry.dispose(); m.material.dispose(); }); sai(grupo); });
    }
    async function projetil(de, ate, c, tam, vel) {
      const dir = new T.Vector3().subVectors(ate, de), len = dir.length();
      const p = caixa(tam, c), r = caixa([tam[0] * 0.5, tam[1] * 0.5, tam[2] * 2.5], "#ffffff", 0.5);
      const q = new T.Quaternion().setFromUnitVectors(V(0, 0, 1), dir.clone().normalize()); p.quaternion.copy(q); r.quaternion.copy(q);
      await anima(len / vel, (a) => { p.position.lerpVectors(de, ate, a); r.position.copy(p.position).addScaledVector(dir.clone().normalize(), -tam[2]); });
      tira(p); tira(r); burst(ate, 1.6, c, 0.18);
    }
    function poeira(pos, h, c) { // Soldado Pó virando pó (Guardião explode na cor dele)
      if (c) { burst(pos, h * 1.3, c, 0.45); }
      for (let i = 0; i < 18; i++) {
        const branco = i < 3, s = 0.3 + Math.random() * 0.4;
        const k = caixa([s, s, s], branco ? "#ebebeb" : (c && i % 3 === 0 ? c : "#1e1e24"));
        const o = pos.clone().add(V((Math.random() - 0.5) * 1.6, (Math.random() - 0.4) * h * 0.8, (Math.random() - 0.5) * 1.6));
        const fim = o.clone().add(V((Math.random() - 0.5) * 3, 1.5 + Math.random() * 2.5, (Math.random() - 0.5) * 3));
        k.position.copy(o); k.rotation.set(Math.random() * 6, Math.random() * 6, 0);
        anima(0.6 + Math.random() * 0.5, (a) => { const e = 1 - (1 - a) ** 2; k.position.lerpVectors(o, fim, e); k.rotation.x += 0.05; k.scale.setScalar(1 - 0.9 * a); k.material.opacity = 1 - a; }).then(() => tira(k));
      }
      const fum = bola(pos.clone().add(V(0, -h * 0.3, 0)), 1, "#46464f", 0.5);
      anima(0.5, (a) => { fum.scale.setScalar(1 + h * 0.9 * a); fum.material.opacity = 0.5 * (1 - a); }).then(() => tira(fum));
    }
    async function cargaFx(tempo) { // energia juntando no Guardião antes do especial
      const g = st.gen, c0 = gp().add(V(0, 2.3, 0));
      const r = disco(c0, 3.5, cor, 0.35);
      let prox = 0;
      await anima(tempo, (a) => {
        r.scale.setScalar(3.5 * (1 - a) + 0.5); r.material.opacity = 0.35 + 0.3 * a;
        if (st.t > prox && vivo(g)) {
          prox = st.t + 0.03;
          const ang = Math.random() * Math.PI * 2, de = c0.clone().add(V(Math.cos(ang) * 4, Math.random() * 4 - 1.5, Math.sin(ang) * 4));
          const b = caixa([0.35, 0.35, 0.35], Math.random() < 0.5 ? cor : "#ffffff"); b.position.copy(de);
          anima(0.25, (k) => { b.position.lerpVectors(de, c0, k * k); b.scale.setScalar(1 - 0.7 * k); }).then(() => tira(b));
        }
      });
      tira(r);
    }

    // ---- golpes normais (MundoServer.golpeInimigo)
    async function golpe() {
      const g = st.gen, gname = info.Golpe || "Soco";
      if (gname === "Tiro" || gname === "Flecha") {
        const tiros = gname === "Tiro" ? 2 : 1;
        pose(gname === "Flecha" ? "Mira" : "Aponta", 0.45 + tiros * 0.15);
        for (let i = 0; i < tiros; i++) {
          await espera(i === 0 ? 0.22 : 0.16); if (!vivo(g)) return;
          const de = gname === "Tiro" ? ponto("PistolaCano", "MaoD") : ponto("ArcoPega", "MaoE");
          if (gname === "Tiro") burst(de, 1.2, "#ffc850", 0.1);
          projetil(de, st.alvo.clone(), gname === "Tiro" ? "#ff4632" : "#ffe63c", gname === "Tiro" ? [0.25, 0.25, 0.8] : [0.18, 0.18, 2.2], gname === "Tiro" ? 120 : 80)
            .then(() => apanha(0.6));
        }
        await espera(0.4);
      } else if (gname === "Corte" || gname === "Martelada") {
        await chega(Math.min(info.Alcance, 4) * 0.8); if (!vivo(g)) return;
        pose("Ergue"); await espera(0.18); if (!vivo(g)) return;
        pose("Corte", 0.3);
        if (gname === "Martelada") {
          const raio = 4.5 * st.escala;
          anel(alvoPe(), raio, "#96ff78", 0.35); burst(alvoPe().add(V(0, 0.5, 0)), raio * 1.2, "#a08c6e", 0.35); apanha(1.3);
        } else { corteFx(elite ? cor : "#ffffff"); apanha(); }
        await espera(0.4);
      } else if (gname === "Estocada") {
        await chega(info.Alcance - 0.5); if (!vivo(g)) return;
        pose("Estoca", 0.35);
        const de = ponto("LancaPonta", "MaoD"), b = haste(de, st.alvo.clone(), 0.4, "#5ab4ff", 0.9);
        some(b, 0.2); await espera(0.15); apanha(); await espera(0.3);
      } else if (gname === "Chute") {
        await chega(info.Alcance - 0.3); if (!vivo(g)) return;
        for (let i = 0; i < 2 && vivo(g); i++) { pose("Chute", 0.28); await espera(0.12); burst(st.alvo.clone().add(V(0, -0.4, 0.8)), 1.6, cor); apanha(0.7); await espera(info.Cada); }
      } else {
        await chega(info.Alcance); if (!vivo(g)) return;
        pose("Soco", 0.35); await espera(0.15); burst(st.alvo, 1.6, "#ffffff"); apanha();
      }
    }

    // ---- especiais (MundoServer.ESPECIAIS + EliteFx)
    async function especial() {
      const g = st.gen, e = info.Especial;
      if (e === "Orochi" || e === "Gigante" || e === "Agua") camera(true);
      if (e === "Orochi") {
        await chega(9); if (!vivo(g)) return;
        const de = V(0, 0, st.z), ate = V(0, 0, st.z - 22);
        pose("Ergue");
        const faixa = caixa([3.5, 0.08, 22], cor, 0.45); faixa.position.set(0, 0.08, st.z - 11);
        const linha = caixa([0.3, 0.1, 22], "#ffffff", 0.8); linha.position.set(0, 0.1, st.z - 11);
        cargaFx(0.9); await espera(0.9); tira(faixa); tira(linha); if (!vivo(g)) return;
        pose("Corte", 0.5);
        const n = 14;
        for (let i = 0; i <= n; i++) {
          espera(i * 0.025).then(() => {
            const k = i / n, p = de.clone().lerp(ate, k).add(V(Math.sin(k * Math.PI * 2) * 1, 2 + Math.sin(k * Math.PI * 3) * 0.8, 0));
            const s = 3.2 * (0.75 - k * 0.35), seg = caixa([s, s, s], cor, 0.92), nuc = caixa([s * 0.5, s * 0.5, s * 0.5], "#fff0c8", 1);
            seg.position.copy(p); nuc.position.copy(p); seg.rotation.z = nuc.rotation.z = Math.PI / 4;
            for (const m of [seg, nuc]) anima(0.5, (a) => { m.scale.setScalar(1 + 0.4 * a); m.material.opacity = (m === seg ? 0.92 : 1) * (1 - a); }).then(() => tira(m));
            if (Math.abs(p.z - st.alvo.z) < 1.2) apanha(1.5);
          });
        }
        espera(n * 0.025).then(() => { // cabeça do dragão com chifres
          const hp = ate.clone().add(V(0, 2, 0)), head = caixa([1.9, 1.4, 2.5], cor, 1); head.position.copy(hp);
          const ch = [-1, 1].map((sx) => { const c = caixa([0.4, 0.4, 2.2], "#ffe678", 1); c.position.copy(hp).add(V(sx * 0.7, 1, 0.8)); c.rotation.x = 0.6; return c; });
          for (const m of [head, ...ch]) anima(0.5, (a) => { m.material.opacity = 1 - a; m.scale.setScalar(1 + 0.5 * a); }).then(() => tira(m));
        });
        await espera(0.9);
      } else if (e === "Agua") {
        await chega(5); if (!vivo(g)) return;
        const c0 = V(0, 0, st.z);
        pose("Carga"); const av = disco(c0, 11, cor, 0.3), fill = disco(c0, 0.5, cor, 0.35);
        cargaFx(0.8); await anima(0.8, (a) => fill.scale.setScalar(0.5 + 10.5 * a)); tira(av); tira(fill); if (!vivo(g)) return;
        pose("Estoca", 0.4);
        for (let i = 0; i < 20; i++) {
          const ang = (i / 20) * Math.PI * 2, b = caixa([1.6, 0.5, 1.6], i % 2 ? "#46a0ff" : "#bee6ff", 0.85);
          const o = c0.clone().add(V(0, 0.5, 0)), fim = c0.clone().add(V(Math.cos(ang) * 11, 1.5, Math.sin(ang) * 11));
          b.position.copy(o);
          anima(0.45, (a) => { const k = 1 - (1 - a) ** 2; b.position.lerpVectors(o, fim, k); b.scale.set(1 + 0.1 * a, 1 + 5 * a, 1 + 0.1 * a); b.material.opacity = 0.85 * (1 - a); }).then(() => tira(b));
        }
        await espera(0.2); apanha(1.4); await espera(0.6);
      } else if (e === "Trovao") {
        const pts = [st.alvo.clone().setY(0), st.alvo.clone().setY(0).add(V(3, 0, 1.5)), st.alvo.clone().setY(0).add(V(-3, 0, -1))];
        pose("Mira");
        const avs = pts.map((p) => [disco(p, 4.5, cor, 0.3), disco(p, 0.5, cor, 0.35)]);
        cargaFx(0.9); await anima(0.9, (a) => avs.forEach(([, f]) => f.scale.setScalar(0.5 + 4 * a))); avs.flat().forEach(tira); if (!vivo(g)) return;
        st.pose = null;
        for (const pt of pts) {
          let last = pt.clone().add(V((Math.random() - 0.5) * 6, 45, (Math.random() - 0.5) * 6)); const top = last.clone();
          for (let i = 1; i <= 6; i++) {
            const nx = top.clone().lerp(pt, i / 6).add(i < 6 ? V(Math.random() * 3 - 1.5, 0, Math.random() * 3 - 1.5) : V(0, 0, 0));
            some(haste(last, nx, 0.6, "#fff05a", 0.95), 0.35); last = nx;
          }
          burst(pt.clone().add(V(0, 1, 0)), 9, "#fffaaa", 0.35);
        }
        apanha(1.5); await espera(0.7);
      } else if (e === "Gigante") {
        await chega(6); if (!vivo(g)) return;
        pose("Carga"); await cargaFx(0.4); if (!vivo(g)) return;
        const grp = st.api.grupo();
        await anima(0.4, (a) => { st.escala = 1 + 0.7 * (1 - (1 - a) ** 2); grp.scale.setScalar(st.escala); });
        if (!vivo(g)) return;
        pose("Ergue"); await espera(0.2); pose("Corte", 0.4);
        const c0 = V(0, 0, st.z); anel(c0, 9, cor, 0.45, 0.8); burst(c0.clone().add(V(0, 1, 0)), 13, "#aa9678", 0.5); apanha(1.6);
        await espera(1.2);
        if (vivo(g)) { pose("Ergue"); await espera(0.2); pose("Corte", 0.3); anel(alvoPe(), 8, "#96ff78", 0.35); apanha(1.3); }
        await espera(1);
        await anima(0.4, (a) => { st.escala = 1.7 - 0.7 * a; grp.scale.setScalar(st.escala); });
      } else if (e === "Regenera") { // com vida: voadora até o alvo (machucada ela se cura: botão "Se cura")
        const de = V(0, 2.2, st.z), fimZ = -(st.D - 2.5);
        pose("Carga"); await cargaFx(0.35); if (!vivo(g)) return;
        pose("Chute", 0.6);
        const z0 = st.z; await anima(0.2, (a) => { st.z = lerp(z0, fimZ, a); st.api.desloca(st.z); });
        const ate = V(0, 2.2, st.z);
        some(haste(de, ate, 1.2, cor, 0.85), 0.35); some(haste(de, ate, 0.4, "#ffffff", 1), 0.35);
        burst(st.alvo.clone().add(V(0, 0, 0.8)), 7, cor, 0.3); apanha(1.6); await espera(0.7);
      }
    }
    async function cura() { // Guardiã Rosa machucada: brilhos subindo e rasteira em volta
      const c0 = gp().add(V(0, 1, 0));
      pose("Chute", 0.4);
      for (let i = 0; i < 12; i++) {
        const b = caixa([0.5, 0.5, 0.5], cor, 1), o = c0.clone().add(V(Math.random() * 3 - 1.5, -1, Math.random() * 3 - 1.5)), fim = o.clone().add(V(0, 4 + Math.random() * 2, 0));
        b.rotation.z = Math.PI / 4; b.position.copy(o);
        anima(0.8 + Math.random() * 0.4, (a) => { b.position.lerpVectors(o, fim, a); b.material.opacity = 1 - a; }).then(() => tira(b));
      }
      anel(gp(), 6, cor, 0.3); await espera(1);
    }
    async function entrada() { // pose de herói, coluna de luz e explosões atrás (EliteFx "Apareceu")
      const g = st.gen, c0 = gp();
      { // câmera de frente (3/4) com espaço pras explosões atrás
        const { camera: cam, controls } = st.api;
        controls.target.set(0, 3.4, 1.5); cam.position.set(7.5, 5.2, -15); controls.update();
      }
      const col = caixa([4, 60, 4], cor, 0.8); col.position.copy(c0).add(V(0, 28, 0));
      anima(1.2, (a) => { col.scale.set(1 - 0.95 * a, 1, 1 - 0.95 * a); col.material.opacity = 0.8 * (1 - a); }).then(() => tira(col));
      burst(c0, 9, cor, 0.6);
      pose("Sentai", 1.6);
      await espera(0.5); if (!vivo(g)) return;
      for (let i = -2; i <= 2; i++) {
        espera((i + 2) * 0.06).then(() => {
          const p0 = c0.clone().add(V(i * 2.6, 1, 5)); // atrás dele (+Z)
          for (const c of [cor, "#ffc83c", "#ff5a1e"]) {
            const b = bola(p0.clone().add(V(0, Math.random() * 2, 0)), 1.5, c, 0.9), o = b.position.clone(), s = 5 + Math.random() * 3, up = 4 + Math.random() * 3;
            anima(0.7, (a) => { const k = 1 - (1 - a) ** 2; b.scale.setScalar(1.5 + (s - 1.5) * k); b.position.copy(o).add(V(0, up * k, 0)); b.material.opacity = 0.9 * (1 - a); }).then(() => tira(b));
          }
        });
      }
      await espera(1.4);
    }
    async function morte() {
      const g = st.gen, grp = st.api.grupo();
      await chega(5); if (!vivo(g)) return; // chega perto antes (fica no meio do vídeo)
      if (elite) { pose("Carga"); await espera(0.3); if (!vivo(g)) return; }
      const box = new T.Box3().setFromObject(grp), h = box.max.y - box.min.y;
      poeira(box.getCenter(new T.Vector3()), h, elite ? cor : null);
      grp.visible = false;
      await espera(1.4);
    }

    const roda = (fn, luta = true) => async () => {
      if (st.ocupado) return;
      if (luta) entraLuta(); st.ocupado = true;
      const g = st.gen;
      try { await fn(); await espera(0.2); } finally { if (vivo(g)) st.ocupado = false; }
    };
    const NOME_G = { Corte: "Corte de espada", Tiro: "Rajada de tiros", Estocada: "Estocada de lança", Flecha: "Flecha de raio", Martelada: "Martelada", Chute: "Chutes" };
    const NOME_E = { Orochi: "Dragão Orochi", Agua: "Onda de água", Trovao: "Chuva de raios", Gigante: "Gigante", Regenera: "Voadora" };
    function botoes() {
      const l = [];
      if (elite) l.push({ id: "entrada", nome: "Entrada de herói", run: roda(entrada, false) });
      l.push({ id: "golpe", nome: NOME_G[info.Golpe] || "Golpe", run: roda(async () => { const g = st.gen; await golpe(); if (!vivo(g) || info.Golpe === "Chute") return; await espera(Math.max(0.2, info.Cada - 0.6)); if (vivo(g)) await golpe(); }) });
      if (elite) l.push({ id: "especial", nome: "Especial · " + (NOME_E[info.Especial] || info.Especial), run: roda(especial), destaque: true });
      if (info.Especial === "Regenera") l.push({ id: "cura", nome: "Se cura", run: roda(cura) });
      l.push({ id: "morte", nome: elite ? "Derrotado" : "Vira pó", run: roda(morte) });
      // sequência pros vídeos: chega, bate, (especial) e morre
      l.push({ id: "luta", nome: "Luta completa", run: roda(async () => {
        const g = st.gen;
        if (elite) { await entrada(); await espera(0.3); if (!vivo(g)) return; }
        await golpe(); await espera(0.5); if (!vivo(g)) return;
        if (!elite) { await golpe(); await espera(0.5); if (!vivo(g)) return; }
        if (elite) { await especial(); await espera(0.5); if (!vivo(g)) return; }
        await morte();
      }) });
      return l;
    }
    function zera() {
      for (const o of objs) st.api && st.api.remove(o); objs.clear();
      st.pose = null; st.fx = []; st.timers = []; st.gen++; st.ocupado = false; st.vel = 0; st.z = 0; st.escala = 1;
      if (st.api) { const grp = st.api.grupo(); if (grp) { grp.visible = true; grp.scale.setScalar(1); } st.api.desloca(0); }
    }
    return {
      botoes,
      parado() { zera(); st.modo = "parado"; if (st.luta) { st.luta = false; if (st.boneco) st.api.remove(st.boneco); st.boneco = null; st.api.luta(false); } },
      andar() { this.parado(); st.modo = "andar"; },
      comeca(api) { st.api = api; T = api.THREE; zera(); st.boneco = null; if (st.luta) { st.luta = false; entraLuta(); } },
      passo(dt, api) {
        st.t += dt;
        for (const tm of [...st.timers]) if (st.t >= tm.at) { st.timers.splice(st.timers.indexOf(tm), 1); tm.res(); }
        const corre = st.fx, gen = st.gen; st.fx = [];
        const vivos = corre.filter((f) => f(dt) !== false);
        if (gen === st.gen) st.fx = vivos.concat(st.fx);
        const t = st.t, P = POSES[st.pose];
        const speed = st.vel > 0 ? st.vel : (st.modo === "andar" && !st.luta ? info.Vel * 0.6 : 0);
        const s = (t * speed) / STRIDE * Math.PI + st.ph;
        const PH = { PernaE: 0, BracoD: 0, PernaD: Math.PI, BracoE: Math.PI };
        let k = 12;
        const out = { corpo: [0, 0], sobe: 0 }; // o corpo dos inimigos não mexe (igual ao jogo: só braços e pernas)
        for (const limb of LIMBS) {
          let a;
          if (P) { a = P[limb] || 0; k = P.V; }
          else if (speed > 0) { a = Math.sin(s + PH[limb]) * (limb.startsWith("Perna") ? 32 : 28); k = 18; }
          else a = limb.startsWith("Braco") ? 4 + Math.sin(t * 2.2 + st.ph + PH[limb]) * 4 : 0;
          const c = st.cur[limb] ?? a;
          st.cur[limb] = lerp(c, a, 1 - Math.exp(-k * dt));
          out[limb] = [st.cur[limb], 0, 0];
        }
        return out;
      },
    };
  }
  return { controlador };
})();

<script>
// Base de dados do BuKatum: monta todas as abas a partir de window.DB (jogo.json + elenco.json + modelos.json,
// colados no index.html pelo tools/gera_pagina.py). Não editar o index.html: editar aqui ou nos dados.
"use strict";
const DB = window.DB, J = DB.jogo, EL = DB.elenco, MOD = DB.modelos, IMGS = new Set(DB.imgs);
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const n = (v, d = 0) => Number(v).toLocaleString("pt-BR", { maximumFractionDigits: d, minimumFractionDigits: 0 });
const pct = (v, d = 1) => n(v * 100, d) + "%";
const img = (id, alt = "", cls = "") => IMGS.has(`img/${id}.png`) ? `<img src="img/${id}.png" alt="${esc(alt)}" loading="lazy" class="${cls}">` : "";

const RAR = { Raro: ["Raro", "raro"], Epico: ["Épico", "epico"], Lendario: ["Lendário", "lendario"] };
const ATAQUE = {
  Single: "Acerta 1 inimigo (o mais perto do fim do caminho / o alvo mais perto)",
  Splash: "Acerta o alvo e quem estiver em volta dele",
  Area: "Acerta todo mundo dentro do alcance, em volta dele",
};
const GOLPE = {
  Soco: "Soco pra frente", Rajada: "Solta energia com as duas mãos", Arremesso: "Arremessa (shuriken)",
  Aponta: "Aponta o dedo pro alvo", Corte: "Golpe de espada", BracosAbertos: "Gira de braços abertos",
  Chute: "Chute", Arco: "Puxa o arco",
};
const MOEDA = { Moedas: "moedas", Gemas: "gemas", Cristais: "Cristais de Despertar", Essencias: "Essências de Poder" };

// ------------------------------------------------------------------ dados juntos por personagem
const UN = Object.entries(J.unidades).map(([id, u]) => ({ id, ...u, el: EL.unidades.find((x) => x.id === id) || {} }))
  .sort((a, b) => a.Order - b.Order);
const UNI = Object.fromEntries(UN.map((u) => [u.id, u]));
const nomeU = (id) => (UNI[id] ? UNI[id].Name : id);
