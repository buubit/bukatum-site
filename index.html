      <div class="upar-bloco"><h4>4 · Despertar (cristais)</h4>${fs.length > 1 ? tabela(["Forma", "Cristais", "Moedas", "Nível", "Itens", "Dano"], fs.slice(1).map((f) => [esc(f.nomeCompleto), n(f.f.Crystals), n(f.f.Coins), f.f.MinLevel, requisitos(u, f).map((r) => `${esc(r.it.Name)} +${r.nv}`).join("<br>"), `×${n(f.mult, 1)}`])) : '<p class="dim">Ainda não tem despertar.</p>'}
        <p class="dim">Cristais de Despertar vêm do evento de defesa: ${J.despertares.CrystalsPerWave} por onda e ${J.despertares.CrystalsVictory} na vitória (× bônus do mapa).</p></div></div>`;
    // ---- calculadora
    const calcHtml = `<div class="calc" id="calc">
      <label>Estrelas <output data-o="estrelas">1★</output><input type="range" min="1" max="${J.banner.MaxStars}" value="1" data-c="estrelas"></label>
      <label>Nível <output data-o="nivel">1</output><input type="range" min="1" max="${J.mundo.MaxLevel}" value="1" data-c="nivel"></label>
      ${fs.length > 1 ? `<label>Forma <select data-c="forma">${fs.map((f) => `<option value="${f.i}">${esc(f.nomeCompleto)}</option>`).join("")}</select></label>` : ""}
      ${its.map((it) => `<label>${esc(it.Name)} <output data-o="it_${it.Id}">+0</output><input type="range" min="0" max="${J.itens.MaxLevel}" value="0" data-c="it_${it.Id}"></label>`).join("")}
      <div class="calc-res" id="calc-res"></div></div>`;
    // ---- onde conseguir
    const pool = UN.filter((x) => !x.Guardado && x.Rarity === u.Rarity).length, rar = J.banner.Rarities.find((r) => r.Id === u.Rarity);
    const ovos = Object.entries(J.mundo.Eggs).map(([z, e]) => ({ z, e, c: (e.Pool.find((p) => p.Id === u.id) || {}).Chance })).filter((x) => x.c)
      .sort((a, b) => ZONAS.findIndex((z) => z.Id === a.z) - ZONAS.findIndex((z) => z.Id === b.z));
    const ondeHtml = `<div class="onde">
      <div class="upar-bloco"><h4>Banner "${esc(J.banner.BannerName)}" (gemas)</h4><p>${esc(rar.Name)}: ${rar.Chance}% por invocação, dividido entre os ${pool} ${esc(rar.Name.toLowerCase())}s = <b>${n(rar.Chance / pool, 2)}%</b> de vir ele. 1 invocação = ${J.banner.Cost1} gemas, 10 = ${J.banner.Cost10}.${u.Rarity === "Lendario" ? ` Garantia: a ${J.banner.Pity}ª invocação sem Lendário dá um Lendário.` : ""}${J.banner.StarterUnit === u.id ? " <b>Todo jogador novo já começa com ele.</b>" : ""}</p></div>
      <div class="upar-bloco"><h4>Ovos (moedas)</h4>${ovos.length ? tabela(["Ovo", "Zona", "Preço", "Chance"], ovos.map((o) => [esc(o.e.Name), esc(zonaNome(o.z)), n(o.e.Cost), `<b>${o.c}%</b>`])) : '<p class="dim">Não sai em nenhum ovo.</p>'}</div></div>`;
    // ---- modelo
    const cores = (id) => { const c = {}; for (const p of MOD[id]?.pecas || []) c[p[5]] = (c[p[5]] || 0) + 1; return Object.entries(c).sort((a, b) => b[1] - a[1]); };
    const modeloHtml = `<div class="modelos-forma">${fs.map((f) => `<div class="upar-bloco"><h4>${esc(f.nomeCompleto)}</h4>
        <div class="mono">${MOD[f.model] ? `${MOD[f.model].pecas.length} peças · ${f.tris ? n(f.tris) + " triângulos · " : ""}${esc(MOD[f.model].arquivo)}` : "sem modelo"}</div>
        <div class="paleta">${cores(f.model).map(([c, q]) => `<i style="background:${c}" title="${c} · ${q} peças"></i>`).join("")}</div></div>`).join("")}
      ${its.filter((it) => MOD[`${u.id}_${it.Id}`]).map((it) => `<div class="upar-bloco"><h4>${esc(it.Name)} (equipamento)</h4><div class="mono">${MOD[`${u.id}_${it.Id}`].pecas.length} peças · ${esc(MOD[`${u.id}_${it.Id}`].arquivo)} · modelado em volta do ${esc(MOD[`${u.id}_${it.Id}`].ref)}</div></div>`).join("")}
      ${u.el.visual ? `<p class="nota">${esc(u.el.visual)}</p>` : ""}</div>`;
    // ---- progresso
    const progHtml = `<div class="upar-bloco">${barra(feitoPct(pr.passos))}<div class="prog">${feitoPct(pr.passos)}% · ${pr.atual ? "personagem atual, começou em " + esc(pr.comecou) : "ainda não é a vez dele"}</div>
      <ol class="todo">${pr.passos.map((p) => `<li class="${p.feito ? "ok" : ""}"><b>${esc(p.nome)}</b>${p.obs ? ` <span class="dim">· ${esc(p.obs)}</span>` : ""}</li>`).join("")}</ol></div>`;

    const secoes = [["acoes", "Ações", acoes], ["itens", "Itens", itensHtml], ["formas", "Formas", formasHtml], ["upar", "Como upar", uparHtml],
      ["calculadora", "Calculadora", calcHtml], ["onde", "Onde conseguir", ondeHtml], ["modelo", "Modelo", modeloHtml], ["progresso", "Progresso", progHtml]];

    setTimeout(() => {
      const palco = $("#palco");
      // golpes no 3D (tools/golpes3d.js): um controlador por forma; os botões mudam com a forma
      let ctl = null;
      const paraDeGirar = () => { est.girar = false; $("#girar").classList.remove("on"); V3.girar(false); };
      const desenhaGolpes = () => {
        const box = $("#golpes"); if (!box) return;
        const lista = ctl.botoes(), modo = (b) => box.querySelectorAll("[data-modo]").forEach((x) => x.classList.toggle("on", x === b));
        box.innerHTML = `<span class="dim">Golpes:</span><button class="chip on" data-modo="parado">Parado</button><button class="chip" data-modo="andar">Andar</button>`
          + lista.map((g, i) => `<button class="chip golpe${g.destaque ? " esp" : ""}" data-golpe="${i}">${esc(g.nome)}</button>`).join("");
        box.querySelectorAll("[data-modo]").forEach((b) => b.onclick = () => { paraDeGirar(); ctl[b.dataset.modo](); modo(b); });
        box.querySelectorAll("[data-golpe]").forEach((b) => b.onclick = () => { paraDeGirar(); modo(null); lista[+b.dataset.golpe].run(); });
      };
      const atualiza = (manter) => {
        const f = fs[est.forma], aura = f.f?.Aura ? { ...f.f.Aura } : null;
        const auraItem = its.find((it) => it.AuraBase && est.ligados.has(it.Id));
        const auraFinal = aura || (auraItem ? { ...auraItem.AuraBase } : null);
        if (auraFinal) auraFinal.nivel = auraItem ? 30 : 0;
        const visuais = its.filter((it) => it.Visual && est.ligados.has(it.Id)).map((it) => `${u.id}_${it.Id}`);
        const mont = its.find((it) => it.Montaria && est.ligados.has(it.Id));
        if (typeof GOLPES3D !== "undefined" && (!ctl || ctl.forma !== est.forma)) { ctl = GOLPES3D.controlador(u, f); ctl.forma = est.forma; desenhaGolpes(); }
        V3.mostra(palco, f.model, { visuais, sentado: !!mont, voo: mont ? mont.Voo : 0, aura: auraFinal, girar: est.girar, manterCamera: manter, anim: ctl });
        document.querySelectorAll("[data-forma]").forEach((b) => b.classList.toggle("on", +b.dataset.forma === est.forma));
        document.querySelectorAll("[data-item]").forEach((b) => b.classList.toggle("on", est.ligados.has(b.dataset.item)));
        $("#legenda3d").textContent = `${f.nomeCompleto} · ${visuais.length || auraItem ? "usando: " + its.filter((it) => est.ligados.has(it.Id)).map((it) => it.Name).join(", ") : "sem itens"}`;
      };
      document.querySelectorAll("[data-forma]").forEach((b) => b.onclick = () => { est.forma = +b.dataset.forma; atualiza(false); if (b.closest(".formas")) palco.scrollIntoView({ behavior: "smooth", block: "nearest" }); });
      document.querySelectorAll("[data-item]").forEach((b) => b.onclick = () => { const id = b.dataset.item; est.ligados.has(id) ? est.ligados.delete(id) : est.ligados.add(id); atualiza(true); });
      $("#todos-itens") && ($("#todos-itens").onclick = () => { const tudo = vis.every((it) => est.ligados.has(it.Id)); vis.forEach((it) => tudo ? est.ligados.delete(it.Id) : est.ligados.add(it.Id)); atualiza(true); });
      $("#girar").onclick = (e) => { est.girar = !est.girar; e.currentTarget.classList.toggle("on", est.girar); V3.girar(est.girar); };
      atualiza(false);
      // calculadora
      const st = { estrelas: 1, nivel: 1, forma: 0, itens: {} };
      const calc = () => {
        const r = calcula(u, st), base = calcula(u, { estrelas: 1, nivel: 1, forma: 0, itens: {} });
        $("#calc-res").innerHTML = `<div><span>Dano</span><b>${n(r.dano)}</b><small>×${n(r.mult, 2)}</small></div>
          <div><span>Recarga</span><b>${n(r.recarga, 2)}s</b><small>${r.recarga < base.recarga ? "−" + pct(1 - r.recarga / base.recarga, 1) : "base"}</small></div>
          <div><span>Alcance</span><b>${n(r.alcance, 1)}</b><small>${r.alcance > base.alcance ? "+" + pct(r.alcance / base.alcance - 1, 1) : "base"}</small></div>
          <div><span>Crítico</span><b>${pct(r.crit, 0)}</b><small>dano ×2</small></div>
          ${r.espCada ? `<div><span>Especial</span><b>×${n(r.espMult, 2)}</b><small>a cada ${r.espCada}</small></div>` : ""}
          <div><span>Dano/s</span><b>${n((r.dano * (1 + r.crit)) / r.recarga)}</b><small>sem especial</small></div>`;
      };
      document.querySelectorAll("[data-c]").forEach((el) => el.oninput = () => {
        const k = el.dataset.c, v = +el.value;
        if (k.startsWith("it_")) st.itens[k.slice(3)] = v; else st[k] = v;
        const o = $(`[data-o="${k}"]`); if (o) o.textContent = k === "estrelas" ? v + "★" : k.startsWith("it_") ? "+" + v : v;
        calc();
      });
      calc();
    });

    return `<a class="voltar" href="#personagens">← Personagens</a>
      <header class="phead ${RAR[u.Rarity][1]}">${badgeRar(u.Rarity)}${u.el.revisado ? ' <span class="badge rev">Revisado</span>' : ""}${pr.atual ? ' <span class="badge agora">Personagem atual</span>' : ""}
        <h1>${esc(u.Name)}</h1><div class="dim">${esc(u.el.anime || "")} · id <code>${u.id}</code> · ${fs.length} forma${fs.length > 1 ? "s" : ""} · ${its.length} de 4 itens</div></header>
      <div class="perso">
        <div class="palco-col"><div class="palco-box ${RAR[u.Rarity][1]}"><div id="palco" class="palco"></div><div id="legenda3d" class="legenda3d"></div></div>
          <div class="ctrl"><div class="ctrl-row">${fs.map((f) => `<button class="chip" data-forma="${f.i}">${esc(f.nome)}</button>`).join("")}</div>
          ${vis.length ? `<div class="ctrl-row"><span class="dim">Itens:</span>${vis.map((it) => `<button class="chip" data-item="${it.Id}">${esc(it.Name)}</button>`).join("")}${vis.length > 1 ? '<button class="chip" id="todos-itens">Todos</button>' : ""}</div>` : '<div class="dim ctrl-row">Sem equipamentos com visual ainda.</div>'}
          <div class="ctrl-row golpes" id="golpes"></div>
          <div class="ctrl-row"><button class="chip on" id="girar">Girar sozinho</button><span class="dim">Arraste pra girar · roda do mouse ou pinça pra zoom</span></div></div>
          <div class="fotos">${fs.map((f) => img(f.id, f.nomeCompleto) ? `<figure>${img(f.id, f.nomeCompleto)}<figcaption>${esc(f.nome)}</figcaption></figure>` : "").join("")}
            ${IMGS.has(`img/itens/${u.id}_visuais.png`) ? `<figure class="larga"><img src="img/itens/${u.id}_visuais.png" alt="" loading="lazy"><figcaption>Com os itens</figcaption></figure>` : ""}</div></div>
        <div class="ficha"><nav class="subnav">${secoes.map(([id, t]) => `<a href="#p/${u.id}/${id}">${t}</a>`).join("")}</nav>
          ${secoes.map(([id, t, h]) => `<section class="sec" id="s-${id}"><h2>${t}</h2>${h}</section>`).join("")}</div></div>`;
  },

  itens() {
    const T = J.itens.Tipos, ti = J.tabelas.itens;
    const linhas = UN.flatMap((u) => itensDe(u.id).map((it) => [`<a href="#p/${u.id}/itens">${esc(u.Name)}</a>`,
      `${IMGS.has(`img/itens/${u.id}_${it.Id}.png`) ? `<img class="ic" src="img/itens/${u.id}_${it.Id}.png" alt="">` : ""}${esc(it.Name)}`,
      it.Poder ? '<span class="poder">poder</span>' : '<span class="equip">equip.</span>', TIPO_TXT[it.Tipo], it.Visual ? "sim" : it.AuraBase ? "aura" : "—", esc(it.Desc)]));
    const ess = J.itens;
    return sec("itens", "Itens próprios", `Cada personagem tem 4 itens só dele (1 poder + 3 equipamentos), de +0 a +${ess.MaxLevel}. Hoje existem ${linhas.length} itens; os equipamentos chegam na vez de cada personagem.`,
      tabela(["Personagem", "Item", "", "Tipo", "Visual", "O que faz"], linhas, "lista"))
      + sec("tipos", "Os 4 tipos", "Cada personagem tem um item de cada tipo.", `<div class="rules">${Object.entries(T).map(([k, t]) => `<div class="rule"><b>${TIPO_TXT[k]}</b>+${n(t.PerLevel * 100, 1)}% de ${t.Text} por nível.<br>${t.Marcos.map((m) => `<span class="marco">+${m.Level}: ${marcoTexto(m)}</span>`).join(" ")}</div>`).join("")}</div>`)
      + sec("custo-itens", "Custo e chance", `Tentativa saindo do nível L: ${"5 + L/2"} gemas e ${"1 + L/4"} Essências. Chance 100% até chegar no +9, depois cai 1% por nível (mínimo 10%), +${pct(ess.FailBonus, 0)} por falha seguida. ${fonte("ItemData.cost / ItemData.chance")}`,
        tabela(["Até", "Gemas (média)", "Essências (média)"], [9, 24, 49, 74, 98].map((i) => [`+${ti[i].para}`, n(ti[i].gemas_total), n(ti[i].essencias_total)]))
        + `<details><summary>Tabela completa +0 → +99</summary>${tabela(["Nível", "Gemas", "Essências", "Chance", "Tentativas"], ti.map((r) => [`+${r.de} → +${r.para}`, r.gemas, r.essencias, r.chance + "%", n(r.tentativas, 2)]))}</details>`)
      + sec("essencias", "Onde caem as Essências de Poder", "A quantidade é multiplicada pelo número da zona (Vale = 1 ... Vila dos Caçadores = 5).",
        tabela(["Fonte", "Quanto"], [...Object.entries(ess.DropChance).map(([k, c]) => [esc(J.mundo.Breakables[k].Name), `${pct(c, 0)} de chance de cair 1 × zona`]),
          ["Chefe da zona", `${ess.BossEssences} × zona`], ["Baú secreto", `${ess.ChestEssences} × zona`], ["Evento de defesa", `${ess.EssencesPerWave} por onda + ${ess.EssencesVictory} na vitória (× bônus do mapa)`]]));
  },

  mundo() {
    const M = J.mundo;
    const zonas = ZONAS.map((z, i) => {
      const b = M.Bosses[z.Id], e = M.Eggs[z.Id];
      return `<article class="zona" style="--z:${z.Color}"><div class="zona-n">${i + 1}</div><div><h3>${esc(z.Name)}</h3>
        <div class="mono">${z.Cost ? `parede: ${n(z.Cost)} moedas` : "zona inicial"} · vida ×${n(z.HpMult)} · moedas ×${n(z.CoinMult)}</div>
        <div class="zona-row">${b ? `<a href="#m/${b.Model}" class="zona-item">${img(b.Model, b.Name)}<span><b>Chefe:</b> ${esc(b.Name)}<br><span class="dim">${n(b.HP * z.HpMult)} de vida · ${n(b.Coins * z.CoinMult)} moedas · ${b.Gems} gemas</span></span></a>` : ""}
        ${e ? `<div class="zona-item ovo"><i class="ovo-ic" style="--a:${e.Color};--b:${e.Spots}"></i><span><b>${esc(e.Name)}</b><br><span class="dim">${n(e.Cost)} moedas</span></span></div>` : ""}</div></div></article>`;
    }).join("");
    const ovos = ZONAS.filter((z) => M.Eggs[z.Id]).map((z) => { const e = M.Eggs[z.Id];
      return `<article class="ovo-card"><header><i class="ovo-ic" style="--a:${e.Color};--b:${e.Spots}"></i><div><h4>${esc(e.Name)}</h4><div class="dim">${esc(z.Name)} · ${n(e.Cost)} moedas (abrir ${M.EggMulti}: ${n(e.Cost * M.EggMulti)})</div></div></header>
        <ul class="pool">${e.Pool.map((p) => `<li><a href="#p/${p.Id}">${img(p.Id, "")}<span>${esc(nomeU(p.Id))}</span><b>${p.Chance}%</b></a></li>`).join("")}</ul></article>`; }).join("");
    const BA = { Raio: "Raio", Rajada: "Rajada de fogo", Terremoto: "Terremoto", Cortes: "Cortes", Salto: "Salto" };
    return sec("zonas", "Zonas do mundo", "Zonas lado a lado. Cada nova fica atrás de uma parede paga com moedas; lá tudo tem mais vida e paga mais.", `<div class="zonas">${zonas}</div>`)
      + sec("quebraveis", "Quebráveis do campo", `Até ${M.MaxPerZone} vivos por zona, um novo a cada ${M.RespawnEvery}s. Vida × vida da zona, moedas × moedas da zona. Clique do jogador: ${M.TapDamage} de dano.`,
        tabela(["Coisa", "Vida", "Moedas", "Chance de aparecer"], Object.values(M.Breakables).map((b) => [esc(b.Name), n(b.HP), n(b.Coins), `${b.Weight}%`])))
      + sec("chefes", "Chefes", `Um por zona na Arena (${M.ArenaSize} studs). Alternam o pisão (a cada ${M.StompEvery}s, raio ${M.StompRadius}, aviso de ${M.StompWarn}s) com o golpe especial. Voltam em ${M.BossRespawn}s.`,
        `<div class="minis">${ZONAS.map((z) => { const b = M.Bosses[z.Id], t = EL.chefes.find((c) => c.id === b.Model) || {};
          return `<a class="mini" href="#m/${b.Model}"><figure class="shot">${img(b.Model, b.Name)}</figure><div><h4>${esc(b.Name)}</h4><div class="dim">${esc(z.Name)} · especial: <b>${esc(t.especial || BA[b.Special])}</b></div><div class="dim">${esc(t.descricao || "")}</div><div class="mono">${n(b.HP * z.HpMult)} vida · ${b.Gems} gemas · ${t.tris ? n(t.tris) + " tris" : ""}</div></div></a>`; }).join("")}</div>`
        + tabela(["Golpe", "Números"], Object.entries(M.BossAttacks).map(([k, a]) => [BA[k] || k, `<span class="mono">${Object.entries(a).map(([x, y]) => `${x} ${y}`).join(" · ")}</span>`])))
      + sec("ovos", "Ovos", "Um por zona, no altar. Repetido vira cópia (estrela).", `<div class="ovos">${ovos}</div>`)
      + sec("secreto", "Baú secreto", "Um por zona, numa sala atrás de uma parede falsa.", tabela(["Vida", "Moedas", "Gemas", "Volta em"], [[n(M.SecretChest.HP), `${n(M.SecretChest.Coins)} × moedas da zona`, M.SecretChest.Gems, `${M.SecretChest.Respawn}s`]]))
      + sec("equipe", "Equipe e montaria", "", tabela(["Coisa", "Valor"], [["Começa com", `${J.banner.TeamSize} vagas`], ["Vagas extras (moedas)", M.SlotCosts.map(n).join(" · ")],
        ["Briga com coisas até", `${M.AggroRadius} studs do jogador`], ["Velocidade da equipe", `${M.FollowSpeed} studs/s (o jogador anda 16)`], ["Teleporta se ficar a", `${M.TeleportDist} studs`],
        ["Nuvem: voo", `${M.NuvemVelocidade} studs/s, sobe ${M.NuvemSubida}, teto ${M.NuvemAlturaMax}`], ["Equipe com o jogador voando", `${M.NuvemSeguir}× mais rápida`]]));
  },

  evento() {
    const C = J.evento, W = J.ondas, mapas = Object.entries(J.mapas).filter(([k]) => k !== "Default");
    const inimigos = Object.entries(J.inimigos).map(([id, e]) => { const t = EL.inimigos.find((x) => x.id === id) || {};
      return `<a class="mini" href="#m/${id}"><figure class="shot">${img(id, e.Name)}</figure><div><h4>${esc(e.Name)}${e.Boss ? ' <span class="badge boss">chefe</span>' : ""}</h4><div class="dim">${esc(t.papel || "")}</div>
        <div class="mono">vida ${n(e.Health)} · vel. ${e.Speed} · ${e.Reward} ouro · tira ${e.Damage} da base</div></div></a>`; }).join("");
    return sec("mapas", "Evento de defesa (tower defense)", `Dá os Cristais de Despertar: ${J.despertares.CrystalsPerWave} por onda + ${J.despertares.CrystalsVictory} na vitória. Também ${J.banner.GemsPerWave} gemas por onda + ${J.banner.GemsVictory} na vitória e Essências. Tudo × bônus do mapa.`,
        `<div class="rules">${mapas.map(([id, m]) => `<div class="rule" style="border-top:5px solid ${m.Color}"><b>${esc(m.Name)}</b>${esc(m.Desc)}<br><span class="mono">${esc(m.Difficulty)} · vida ×${n(m.HpMult, 2)} · prêmios ×${n(m.GemMult, 2)}</span>${m.Enemies ? `<br><span class="dim">Inimigos trocados: ${Object.entries(m.Enemies).map(([a, b]) => `${esc(J.inimigos[a].Name)} → ${esc(J.inimigos[b].Name)}`).join(", ")}</span>` : ""}</div>`).join("")}</div>`)
      + sec("ondas", "Ondas", `${W.length} ondas. Inimigos ganham +${pct(C.HpScalePerWave, 0)} de vida por onda.`,
        tabela(["Onda", "Inimigos", "Total"], W.map((o, i) => [i + 1, o.map((g) => `${g.Count}× ${esc(J.inimigos[g.Enemy].Name)}`).join(" + "), o.reduce((s, g) => s + g.Count, 0)])))
      + sec("inimigos", "Inimigos", "", `<div class="minis">${inimigos}</div>`)
      + sec("regras-td", "Regras da partida", "", tabela(["Coisa", "Valor"], [["Ouro inicial", C.StartGold], ["Vida da base", C.BaseHP], ["Preparação", C.PrepTime + "s"], ["Entre ondas", C.Intermission + "s"],
        ["Máx. unidades por jogador", C.MaxUnitsPerPlayer], ["Vender devolve", pct(C.SellRefund, 0)], ["Bônus por onda", `${C.WaveBonus} ouro (+25 × onda)`]]))
      + sec("niveis-td", "Unidades na partida", "Na partida a unidade é colocada com ouro e melhora até o nível 4 (também com ouro).",
        tabela(["Personagem", "Preço", "Nv 1", "Nv 2", "Nv 3", "Nv 4"], UN.map((u) => [`<a href="#p/${u.id}">${esc(u.Name)}</a>`, u.Cost,
          ...u.Levels.map((l) => `<span class="mono">${l.Damage} dano · ${l.Range} alc · ${n(l.Cooldown, 2)}s${l.Cost ? `<br>${l.Cost} ouro` : ""}</span>`)])));
  },

  economia() {
    const M = J.mundo, S = J.banner, I = J.itens, A = J.despertares;
    const moedas = [
      ["Moedas", `Quebrar coisas no mundo, chefes (${n(M.Bosses.Vale.Coins)}), baú secreto (${n(M.SecretChest.Coins)}); tudo × o multiplicador de moedas da zona (×1 a ×${n(ZONAS.at(-1).CoinMult)})`, "Paredes das zonas, ovos, níveis, vagas na equipe, despertar"],
      ["Gemas", `Começa com ${S.StartGems}, evento de defesa (${S.GemsPerWave}/onda + ${S.GemsVictory} na vitória), chefes (${Object.values(M.Bosses).map((b) => b.Gems).join("/")}), baú secreto (${M.SecretChest.Gems})`, `Banner (${S.Cost1} / ${S.Cost10} por 10), itens`],
      ["Cristais de Despertar", `Evento de defesa: ${A.CrystalsPerWave}/onda + ${A.CrystalsVictory} na vitória (× mapa)`, "Despertar"],
      ["Essências de Poder", `Quebráveis por sorte, chefe ${I.BossEssences}×zona, baú ${I.ChestEssences}×zona, evento ${I.EssencesPerWave}/onda + ${I.EssencesVictory}`, "Itens"],
    ];
    const tn = J.tabelas.nivel, marcos = [4, 9, 19, 28];
    return sec("moedas", "Moedas do jogo", "O que cada uma faz, de onde vem e onde gasta.", tabela(["Moeda", "Como ganhar", "Onde gastar"], moedas.map((m) => [`<b>${m[0]}</b>`, m[1], m[2]])))
      + sec("banner", `Banner "${esc(S.BannerName)}"`, `${S.Cost1} gemas por invocação, ${S.Cost10} por 10. Garantia de Lendário na ${S.Pity}ª sem Lendário.`,
        tabela(["Raridade", "Chance", "Personagens", "Cada um"], S.Rarities.map((r) => { const q = UN.filter((u) => !u.Guardado && u.Rarity === r.Id); return [badgeRar(r.Id), r.Chance + "%", q.length ? q.map((u) => `<a href="#p/${u.id}">${esc(u.Name)}</a>`).join(", ") : '<span class="dim">ninguém no jogo agora (cai na raridade mais perto)</span>', q.length ? n(r.Chance / q.length, 2) + "%" : "—"]; })))
      + sec("nivel", "Preço dos níveis", `Nível ${1} a ${M.MaxLevel}. Cada nível dá +${n(M.LevelDamage * 100)}% de dano. Preço = base da raridade × ${n(M.LevelGrowth, 2)} a cada nível.`,
        tabela(["Raridade", ...marcos.map((i) => `Até Nv ${i + 2}`)], Object.keys(tn).map((r) => [badgeRar(r), ...marcos.map((i) => n(tn[r][i].total))])))
      + sec("vagas", "Vagas na equipe", `Começa com ${S.TeamSize}.`, tabela(["Vaga", "Preço"], M.SlotCosts.map((c, i) => [`${S.TeamSize + i + 1}ª`, n(c) + " moedas"])))
      + sec("zonas-preco", "Paredes das zonas", "", tabela(["Zona", "Preço"], ZONAS.map((z) => [esc(z.Name), z.Cost ? n(z.Cost) : "grátis"])));
  },

  modelos() {
    const grupos = [["unidade", "Personagens e formas"], ["chefe", "Chefes"], ["inimigo", "Inimigos do evento"], ["visual", "Equipamentos"], ["icone", "Ícones dos itens"]];
    setTimeout(() => document.querySelectorAll("[data-foto3d]").forEach((el) => { const u = V3.foto(el.dataset.foto3d); if (u) el.innerHTML = `<img src="${u}" alt="">`; }));
    return sec("modelos", "Modelos 3D", `Todos os ${Object.keys(MOD).length} modelos blocky do jogo, peça por peça (as mesmas peças que viram Part no Roblox). Clique pra girar em 3D.`,
      grupos.map(([t, titulo]) => { const ids = Object.keys(MOD).filter((k) => MOD[k].tipo === t); if (!ids.length) return "";
        return `<h3 class="grupo">${titulo} <span class="dim">${ids.length}</span></h3><div class="mgrid">${ids.map((id) => `<a class="mcard" href="#m/${id}">
          <div class="mfoto"${img(id) ? "" : ` data-foto3d="${id}"`}>${img(id, id)}</div><b>${esc(nomeModelo(id))}</b><span class="mono">${MOD[id].pecas.length} peças</span></a>`).join("")}</div>`; }).join(""));
  },

  m(id) {
    const M = MOD[id];
    if (!M) return `<p>Modelo não encontrado. <a href="#modelos">Voltar</a></p>`;
    const dono = UN.find((u) => formas(u).some((f) => f.model === id) || id.startsWith(u.id + "_") || id.startsWith("icone_" + u.id + "_"));
    const c = {}; for (const p of M.pecas) c[p[5]] = (c[p[5]] || 0) + 1;
    const nomes = {}; for (const p of M.pecas) nomes[p[0]] = (nomes[p[0]] || 0) + 1;
    setTimeout(() => V3.mostra($("#palco"), id, M.tipo === "visual" ? {} : {}));
    return `<a class="voltar" href="#modelos">← Modelos</a><header class="phead"><h1>${esc(nomeModelo(id))}</h1><div class="dim">${M.tipo} · ${M.pecas.length} peças · <code>${esc(M.arquivo)}</code>${dono ? ` · <a href="#p/${dono.id}">ficha de ${esc(dono.Name)}</a>` : ""}</div></header>
      <div class="perso"><div class="palco-col"><div class="palco-box"><div id="palco" class="palco"></div></div><p class="dim">Arraste pra girar · roda do mouse ou pinça pra zoom.</p></div>
      <div class="ficha"><section class="sec"><h2>Cores</h2><div class="paleta grande">${Object.entries(c).sort((a, b) => b[1] - a[1]).map(([k, q]) => `<span><i style="background:${k}"></i><code>${k}</code> ${q}</span>`).join("")}</div></section>
      <section class="sec"><h2>Peças</h2><p class="sec-sub">Nome no Blender → no Roblox. "spike" vira pirâmide; o resto é caixa.</p>
      <div class="nomes">${Object.entries(nomes).map(([k, q]) => `<span>${esc(k)}${q > 1 ? ` <b>×${q}</b>` : ""}</span>`).join("")}</div></section></div></div>`;
  },

  planos() {
    const P = EL.planos || { gamepasses: [] };
    return sec("gamepasses", "Gamepasses (venda por Robux)", esc(P.texto || ""), `<div class="rules">${P.gamepasses.map((g) => `<div class="rule"><b>${esc(g.nome)}</b>${esc(g.ideia)}<br><span class="badge ideia">${esc(g.status)}</span></div>`).join("")}</div>`)
      + sec("processo", EL.processo.titulo, EL.processo.regra, `<ol class="todo">${EL.processo.passos.map((p) => `<li><b>${esc(p)}</b></li>`).join("")}</ol>`)
      + sec("fila", "Fila dos personagens", "Progresso de cada um no guia \"personagem pronto\".", tabela(["Personagem", "Raridade", "Pronto"], UN.map((u) => { const pr = progressoDe(u.id); return [`<a href="#p/${u.id}/progresso">${esc(u.Name)}</a>`, badgeRar(u.Rarity), `${barra(feitoPct(pr.passos))}<span class="prog">${feitoPct(pr.passos)}%</span>`]; })));
  },

  arquivos() {
    const T = { dados: "Dados (números do jogo)", servidor: "Servidor", cliente: "Cliente (tela e efeitos)", ferramenta: "Ferramentas (Blender e montagem)" };
    return sec("arquivos", "Arquivos do jogo", `Onde fica cada coisa em <code>${esc(J.fonte)}</code>. Os números desta página vêm dos arquivos de "Dados".`,
      Object.entries(T).map(([k, t]) => `<h3 class="grupo">${t}</h3>` + tabela(["Arquivo", "Linhas", "O que é"], J.arquivos.filter((a) => a.tipo === k).map((a) => [`<code>${esc(a.caminho.split("/").pop())}</code>`, a.linhas, esc(a.resumo)]))).join(""));
  },
};
function nomeModelo(id) {
  if (UNI[id]) return UNI[id].Name;
  for (const u of UN) { const f = formas(u).find((x) => x.model === id); if (f) return f.nomeCompleto; }
  const b = Object.values(J.mundo.Bosses).find((x) => x.Model === id); if (b) return b.Name;
  if (J.inimigos[id]) return J.inimigos[id].Name;
  const m = id.match(/^(icone_)?([^_]+)_(.+)$/);
  if (m) { const it = itensDe(m[2]).find((x) => x.Id.toLowerCase() === m[3].toLowerCase()); return (m[1] ? "Ícone: " : "") + (it ? it.Name : m[3]) + " · " + nomeU(m[2]); }
  return id;
}

// ------------------------------------------------------------------ navegação
const ABAS = [["inicio", "Início"], ["personagens", "Personagens"], ["itens", "Itens"], ["mundo", "Mundo"], ["evento", "Evento"], ["economia", "Economia"], ["modelos", "Modelos 3D"], ["planos", "Planos"], ["arquivos", "Arquivos"]];
function rota() {
  const [pg, arg, sub] = (location.hash.slice(1) || "inicio").split("/").map(decodeURIComponent);
  const f = PAGINAS[pg] || PAGINAS.inicio, chave = pg + "/" + (arg || "");
  const aba = pg === "p" ? "personagens" : pg === "m" ? "modelos" : pg;
  document.querySelectorAll(".abas a").forEach((a) => a.classList.toggle("on", a.dataset.aba === aba));
  if (rota.ultima !== chave) {
    V3.para();
    $("#conteudo").innerHTML = f(arg);
    rota.ultima = chave;
    if (!sub) window.scrollTo(0, 0);
  }
  if (sub) { const alvo = document.getElementById("s-" + sub) || document.getElementById(sub); if (alvo) setTimeout(() => alvo.scrollIntoView({ block: "start" }), 120); }
}
$("#abas").innerHTML = ABAS.map(([id, t]) => `<a href="#${id}" data-aba="${id}">${t}</a>`).join("");
window.addEventListener("hashchange", rota);
rota();
</script>
</body>
</html>
