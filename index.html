<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuKatum Base de Dados</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* BuKatum · base de dados. Cartas de personagem com borda da raridade, fonte de jogo nos títulos. */
:root {
  --bg: #eef0f7; --surface: #ffffff; --ink: #1d1a2e; --dim: #66627c; --line: #d9dbe8; --tile: #e3e6f2;
  --raro: #3f8cff; --epico: #a04dff; --lendario: #e8a400; --boss: #e0432f; --accent: #ff8a1f; --ok: #1fa86b;
  --display: "Lilita One", "Arial Black", sans-serif; --body: "Nunito", "Segoe UI", sans-serif; --mono: "JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15131f; --surface: #1f1c2c; --ink: #f1eefb; --dim: #a39fb8; --line: #322e44; --tile: #2a2639; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #15131f; --surface: #1f1c2c; --ink: #f1eefb; --dim: #a39fb8; --line: #322e44; --tile: #2a2639; color-scheme: dark }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
a { color: inherit; }
code { font-family: var(--mono); font-size: 12px; background: var(--tile); border-radius: 4px; padding: 1px 5px; }
.dim { color: var(--dim); }
.mono { font-family: var(--mono); font-size: 12px; color: var(--dim); }
.kicker { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* topo fixo com as abas */
.topo { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topo-in { max-width: 1240px; margin: 0 auto; padding: 8px max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 14px; }
.marca { font-family: var(--display); font-size: 24px; text-decoration: none; white-space: nowrap; }
.marca span, .hero h1 span { color: var(--accent); }
.abas { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.abas::-webkit-scrollbar { display: none; }
.abas a { text-decoration: none; font-weight: 800; font-size: 14px; padding: 6px 12px; border-radius: 999px; white-space: nowrap; color: var(--dim); }
.abas a:hover { color: var(--ink); background: var(--tile); }
.abas a.on { background: var(--ink); color: var(--bg); }

main { max-width: 1240px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 72px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 36px; }
.sec { min-width: 0; }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.05; text-wrap: balance; }
h2 { font-size: 30px; margin-bottom: 4px; }
h3 { font-size: 22px; }
h4 { font-size: 18px; }
.sec-sub { color: var(--dim); margin: 0 0 16px; max-width: 75ch; }
.hero h1 { font-size: clamp(44px, 8vw, 76px); line-height: .95; }
.hero p { color: var(--dim); max-width: 64ch; margin: 10px 0 0; }
.counts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.counts a { text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 800; }
.counts a b { font-family: var(--display); font-weight: 400; color: var(--accent); margin-right: 6px; font-size: 17px; }
.fonte { font-family: var(--mono); font-size: 11px; color: var(--dim); border: 1px dashed var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.nota { color: var(--dim); font-size: 14px; margin: 12px 0 0; }

/* chips e selos */
.badge { display: inline-block; background: var(--c, var(--dim)); color: #fff; font-weight: 800; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; border-radius: 6px; padding: 2px 8px; vertical-align: middle; }
.badge.raro { --c: var(--raro); } .badge.epico { --c: var(--epico); } .badge.lendario { --c: var(--lendario); } .badge.boss { --c: var(--boss); }
.badge.rev { --c: var(--accent); } .badge.agora { --c: var(--ok); } .badge.ideia { --c: var(--dim); margin-top: 6px; }
.poder, .equip { background: var(--lendario); color: #fff; font-family: var(--body); font-size: 10px; font-weight: 800; text-transform: uppercase; border-radius: 4px; padding: 1px 5px; vertical-align: middle; letter-spacing: .04em; }
.equip { background: var(--raro); }
.chip { font: inherit; font-weight: 800; font-size: 13px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 12px; }
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.golpe.esp { border-color: var(--accent); }
.chip.golpe:active { transform: scale(0.96); }
.marco { display: inline-block; background: var(--tile); border-radius: 6px; padding: 1px 7px; margin: 0 4px 4px 0; font-size: 13px; }
.bar { height: 8px; background: var(--tile); border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.prog { font-family: var(--mono); font-size: 12px; color: var(--dim); }

/* tabelas */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 800; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 12px; border-bottom: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
td .bar { width: 120px; display: inline-block; vertical-align: middle; margin: 0 8px 0 0; }
td img.ic { width: 22px; height: 22px; object-fit: contain; vertical-align: middle; margin-right: 6px; }
details { margin-top: 10px; }
summary { cursor: pointer; font-weight: 800; color: var(--accent); margin-bottom: 8px; }
details .tbl-wrap { max-height: 420px; overflow-y: auto; }

/* início */
.agora-card { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--lendario); border-radius: 16px; padding: 16px; }
.agora-card:hover { border-color: var(--accent); }
.strip { display: grid; grid-template-columns: repeat(4, 1fr); background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--lendario) 25%, var(--tile)), var(--tile) 70%); border-radius: 12px; align-self: start; }
.strip figure { margin: 0; position: relative; aspect-ratio: 4/5; }
.strip img { width: 100%; height: 100%; object-fit: contain; }
.strip figcaption, .fotos figcaption { position: absolute; left: 6px; bottom: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; background: var(--surface); border-radius: 999px; padding: 1px 8px; }
.link { display: inline-block; margin-top: 10px; font-weight: 800; color: var(--accent); }
.todo { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 6px; }
.todo li { color: var(--dim); }
.todo li b { font-family: var(--body); font-weight: 800; color: var(--ink); }
.todo li.ok b { color: var(--ok); }
.todo li.ok b::before { content: "✓ "; }
.steps { display: grid; gap: 10px; counter-reset: s; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 14px 60px; position: relative; }
.step::before { counter-increment: s; content: counter(s); position: absolute; left: 18px; top: 10px; font-family: var(--display); font-size: 30px; color: var(--accent); }
.step b { font-family: var(--display); font-weight: 400; font-size: 19px; }
.checks { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
.checks li { font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--dim); }
.checks li.ok { border-color: var(--ok); color: var(--ink); }
.checks li.ok::before { content: "✓ "; color: var(--ok); font-weight: 800; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.rule { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.rule b { font-family: var(--display); font-weight: 400; font-size: 19px; display: block; margin-bottom: 4px; }
.formula { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 10px; padding: 12px 14px; }

/* grade de personagens */
.filtros { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.pcard { --c: var(--dim); text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--c); border-radius: 14px; overflow: hidden; display: grid; transition: transform .12s; }
.pcard:hover { transform: translateY(-3px); border-color: var(--c); }
.pcard.raro, .phead.raro, .palco-box.raro { --c: var(--raro); } .pcard.epico, .phead.epico, .palco-box.epico { --c: var(--epico); } .pcard.lendario, .phead.lendario, .palco-box.lendario { --c: var(--lendario); }
.pfoto { position: relative; aspect-ratio: 1; background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c) 28%, var(--tile)), var(--tile) 70%); }
.pfoto img { width: 100%; height: 100%; object-fit: contain; }
.pforma { position: absolute; left: 8px; top: 8px; background: var(--epico); color: #fff; font-size: 11px; font-weight: 800; border-radius: 999px; padding: 1px 8px; }
.pinfo { padding: 10px 12px 12px; display: grid; gap: 3px; }
.pinfo h3 { font-size: 20px; margin-top: 4px; }
.selos { display: flex; flex-wrap: wrap; gap: 4px; }
.mini-stats { display: flex; gap: 10px; font-family: var(--mono); font-size: 12px; color: var(--dim); margin-top: 4px; flex-wrap: wrap; }

/* ficha do personagem */
.voltar { text-decoration: none; font-weight: 800; color: var(--dim); margin-bottom: -24px; }
.voltar:hover { color: var(--accent); }
.phead h1 { font-size: clamp(34px, 5.5vw, 54px); margin: 6px 0 4px; }
.perso { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 28px; align-items: start; }
.palco-col { position: sticky; top: 66px; display: grid; gap: 10px; }
.palco-box { --c: var(--accent); position: relative; border-radius: 16px; border: 1px solid var(--line); background: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--c) 30%, var(--tile)), var(--tile) 72%); overflow: hidden; }
.palco { aspect-ratio: 1 / 1.05; width: 100%; touch-action: none; }
.palco3d { width: 100% !important; height: 100% !important; display: block; cursor: grab; }
.palco3d:active { cursor: grabbing; }
.sem3d { display: grid; place-items: center; height: 100%; color: var(--dim); font-weight: 800; }
.legenda3d { position: absolute; left: 10px; bottom: 10px; right: 10px; font-size: 12px; font-weight: 800; background: color-mix(in srgb, var(--surface) 85%, transparent); border-radius: 8px; padding: 3px 9px; width: fit-content; max-width: calc(100% - 20px); }
.ctrl { display: grid; gap: 8px; }
.ctrl-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.fotos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.fotos figure { margin: 0; position: relative; aspect-ratio: 4/5; background: var(--tile); border-radius: 10px; overflow: hidden; }
.fotos figure.larga { grid-column: span 2; grid-row: span 2; aspect-ratio: auto; }
.fotos img { width: 100%; height: 100%; object-fit: contain; }
.ficha { display: grid; gap: 30px; min-width: 0; }
.subnav { position: sticky; top: 58px; z-index: 5; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; background: var(--bg); padding: 8px 0; border-bottom: 1px solid var(--line); }
.subnav a { text-decoration: none; font-weight: 800; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); white-space: nowrap; }
.subnav a:hover { border-color: var(--accent); color: var(--accent); }
.ficha .sec { scroll-margin-top: 110px; }
.acoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.acao { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 3px; align-content: start; }
.acao b { font-family: var(--display); font-weight: 400; font-size: 19px; }
.acao.esp { border-left: 5px solid var(--epico); }
.itens-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.item-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; align-content: start; }
.item-card.vazio { border-style: dashed; background: transparent; }
.item-top { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; }
.item-ic { width: 56px; height: 56px; border-radius: 12px; background: var(--tile); display: grid; place-items: center; overflow: hidden; }
.item-ic img { width: 100%; height: 100%; object-fit: contain; }
.inicial { font-family: var(--display); font-size: 26px; color: var(--dim); }
dl { display: grid; grid-template-columns: 80px 1fr; gap: 6px 10px; margin: 0; font-size: 14px; }
dt { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); padding-top: 3px; }
dd { margin: 0; min-width: 0; }
.ver { justify-self: start; }
.formas { display: grid; gap: 10px; }
.forma { display: grid; grid-template-columns: 110px 1fr; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.forma.vazio { grid-template-columns: 1fr; border-style: dashed; background: transparent; }
.forma-foto { background: var(--tile); }
.forma-foto img { width: 100%; height: 100%; object-fit: contain; }
.forma-info { padding: 12px 14px 12px 0; display: grid; gap: 5px; align-content: start; }
.forma.vazio .forma-info { padding-left: 14px; }
.aura-cores { display: flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 800; color: var(--dim); }
.aura-cores i, .paleta i { width: 18px; height: 18px; border-radius: 5px; display: inline-block; border: 1px solid rgba(0,0,0,.15); }
.upar, .onde, .modelos-forma { display: grid; gap: 12px; }
.upar-bloco { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.upar-bloco p { margin: 0; }
.upar-bloco .tbl-wrap { border-radius: 10px; }
.calc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 18px; }
.calc label { display: grid; gap: 4px; font-weight: 800; font-size: 13px; }
.calc output { font-family: var(--mono); color: var(--accent); }
.calc input[type=range] { width: 100%; accent-color: var(--accent); }
.calc select { font: inherit; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.calc-res { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.calc-res div { background: var(--tile); border-radius: 10px; padding: 8px 10px; display: grid; }
.calc-res span { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 800; color: var(--dim); }
.calc-res b { font-family: var(--display); font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums; }
.calc-res small { font-family: var(--mono); color: var(--dim); }
.paleta { display: flex; flex-wrap: wrap; gap: 4px; }
.paleta.grande span { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; font-size: 13px; }
.nomes { display: flex; flex-wrap: wrap; gap: 5px; }
.nomes span { font-family: var(--mono); font-size: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }

/* mundo, evento */
.zonas { display: grid; gap: 10px; }
.zona { display: grid; grid-template-columns: 56px 1fr; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-left: 8px solid var(--z); border-radius: 14px; padding: 12px 14px; }
.zona-n { font-family: var(--display); font-size: 40px; color: var(--z); line-height: 1; }
.zona-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.zona-item { display: flex; align-items: center; gap: 8px; background: var(--tile); border-radius: 10px; padding: 6px 10px 6px 6px; text-decoration: none; font-size: 14px; }
.zona-item img { width: 48px; height: 56px; object-fit: contain; }
.ovo-ic { width: 34px; height: 42px; border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%; display: inline-block; flex: none; background: radial-gradient(circle at 30% 35%, var(--b) 0 12%, transparent 13%), radial-gradient(circle at 68% 62%, var(--b) 0 10%, transparent 11%), var(--a); border: 2px solid rgba(0,0,0,.15); }
.zona-item.ovo { padding-left: 10px; }
.ovos { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.ovo-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.ovo-card header { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.pool { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.pool a { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; text-decoration: none; padding: 2px 6px 2px 2px; border-radius: 8px; }
.pool a:hover { background: var(--tile); }
.pool img { width: 34px; height: 40px; object-fit: contain; }
.minis { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; margin-bottom: 12px; }
.mini { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; padding-right: 12px; overflow: hidden; text-decoration: none; }
.mini:hover { border-color: var(--accent); }
.mini .shot { margin: 0; background: var(--tile); aspect-ratio: 4/5; }
.mini .shot img { width: 100%; height: 100%; object-fit: contain; }
.mini h4 { font-size: 18px; }

/* galeria de modelos */
.grupo { margin: 18px 0 10px; }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.mcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; text-decoration: none; display: grid; gap: 2px; padding-bottom: 8px; text-align: center; }
.mcard:hover { border-color: var(--accent); }
.mcard b { font-size: 13px; padding: 0 6px; }
.mfoto { aspect-ratio: 5/6; background: var(--tile); }
.mfoto img { width: 100%; height: 100%; object-fit: contain; }

@media (max-width: 900px) {
  .perso { grid-template-columns: 1fr; }
  .palco-col { position: static; }
  .palco { aspect-ratio: 1 / 1; }
  .agora-card { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  .marca { font-size: 20px; }
  .strip { grid-template-columns: repeat(2, 1fr); }
  .pgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .pinfo h3 { font-size: 17px; }
  .forma { grid-template-columns: 84px 1fr; }
  dl { grid-template-columns: 1fr; }
  dt { padding-top: 0; }
  .mini { grid-template-columns: 76px 1fr; }
}

/* classes da equipe (SummonData.Classes) */
.badge.cls-DPS { background: #ff5a46; color: #1a1414; }
.badge.cls-Suporte { background: #5adc8c; color: #102016; }
.badge.cls-Farm { background: #ffc83c; color: #221a06; }
.subt { margin: 22px 0 10px; font-size: 1.05rem; }
.pgrid.guardados { opacity: .6; }
</style>
</head>
<body>
<header class="topo"><div class="topo-in"><a class="marca" href="#inicio">Bu<span>Katum</span></a><nav class="abas" id="abas" aria-label="Abas"></nav></div></header>
<main id="conteudo"></main>

meros ajustáveis no Balanceamento"},{"nome":"Visual dos equipamentos","feito":true,"obs":"Aprovados: Nuvem (todas as formas sentam de perna cruzada, rabo balançando e pedacinhos) e Pesos de Luta (4 blocos vermelhos 10t: pulsos e canelas). Aparecem com o item em +1. Montaria do jogador: botão NUVEM ou F monta e voa (WASD/analógico, E sobe, Q desce, F ou pular desce); não dá pra passar parede de zona trancada voando"},{"nome":"Auras de cada forma","feito":true,"obs":"Aprovada: cubinhos nascem no chão, sobem e somem + anel pulsando. Criança = ki branco (com o item Aura equipado), SSJ dourada, SS3 com faísca azul, SS4 vermelha. Mais nível no item Aura = mais cubinhos"},{"nome":"Itens de evolução de cada forma","feito":false,"obs":"Depois, quando o resto estiver pronto (decisão dele, 18/10). Hoje usa só Cristais de Despertar genéricos"},{"nome":"Raid onde cada item cai","feito":false,"obs":"Depois, quando o resto estiver pronto (decisão dele, 18/10)"},{"nome":"Balanceamento","feito":false,"obs":"Só quando os inimigos existirem (decisão dele, 18/10). Dano, preço em moedas, cristais e nível mínimo de cada forma; e o combo novo (socos ×1, ki ×1,2, kamehameha pequeno ×1,6) + barra de 8 golpes + especiais ×6/×5/×7/×9"},{"nome":"Efeitos e sons dos golpes","feito":true,"obs":"APROVADOS (18/10): socos com estalos, bola de ki grande, Kamehameha pequeno, Genki Dama (energia vindo de todo lado + explosão azul), Kamehamehas com pulo, dragão verde de blocos no SS4 e teletransporte com riscos de luz"},{"nome":"No jogo e testado","feito":false,"obs":"Modelos e especiais no Studio e testados no Play; falta publicar"},{"nome":"Guia atualizado","feito":false,"obs":"Marca no fim, com tudo pronto"}]},"etapas":[{"titulo":"7 campeões pra jogar e publicar","descricao":"Decisão dele (18/10): começar com 3 DPS, 3 Suportes e 1 Farm pra jogar e publicar logo; os outros 10 ficam guardados e voltam depois. Um por vez até o fim, como o Goku.","itens":[{"nome":"Goku (DPS)","feito":false},{"nome":"Luffy (DPS)","feito":false},{"nome":"Ichigo (DPS)","feito":false},{"nome":"Tony Tony Chopper (Suporte)","feito":false},{"nome":"Charmy Pappitson (Suporte)","feito":false},{"nome":"Orihime Inoue (Suporte)","feito":false},{"nome":"Nami (Farm)","feito":false}]},{"titulo":"Base: Aincrad com NPCs","descricao":"Ideia dele (18/10): a base é o Aincrad (Sword Art Online) voando no céu do mundo — do chão dá pra ver ele por baixo e um portal leva pra cima. Dentro: um jardim grande com a torre no meio, como se fosse a subida pro próximo andar. Dentro dele ficam os NPCs: o Greed (Grid, de Overgeared) é o ferreiro e cuida só dos equipamentos; a Norma Selner (a \"senhorita Selene\" de Solo Leveling) cuida das passivas (rolar e melhorar). O Greed saiu da fila de campeões e virou NPC; o Chopper continua como suporte de buff. Novo NPC (18/10): Echidna, a Bruxa da Ganância (Re:Zero), na mesa de chá do jardim — cuida do Livro da Sabedoria (o livro de tudo: inimigos, chefes, recompensas por completar) e do Renascer dos campeões.","itens":[{"nome":"Tudo no Studio: Aincrad voando no céu do mundo, jardim com a torre, forja do Greed, escritório da Selner e chá da Echidna","feito":true},{"nome":"Modelo do Greed (ferreiro) — opção 1: armadura de Pagma vermelha e dourada + martelo","feito":true},{"nome":"Aincrad por fora — opção 2 (andares de aço com janelas acesas, disco com torres, raízes de pedra)","feito":true},{"nome":"Aincrad por dentro — opção 2: jardim real (alamedas em estrela, sebes em anéis, canteiros e fontes) com a torre de subida no meio","feito":true},{"nome":"Cabaninha da forja do Greed — opção 3: cabaninha de pedra (meia parede, telhado vermelho, chaminé de pedra, placa do martelo)","feito":true},{"nome":"Portal no chão do Vale (perto do spawn) que leva pro jardim, e o portal do jardim que volta — no Studio e testado","feito":true},{"nome":"Forja do Greed: \"Fortalecer itens\" sai da tela EQUIPE e vai pro NPC (prompt \"Forjar\" abre a FORJA DO GREED; longe dele o botão vira \"VÁ NA FORJA\" e o servidor recusa)","feito":true},{"nome":"Animação da forja e do Greed: ele martela a peça em brasa (3 marteladas e vira a peça) com faísca e som de bigorna; fogo na fornalha com luz tremendo, brasas subindo e fumaça na chaminé; quando alguém fortalece: 3 marteladas fortes e estouro dourado (sucesso) ou fumaça (falhou)","feito":true},{"nome":"Greed: EVOLUIR equipamentos — estágios Comum → Raro (+20) → Épico (+40) → Lendário (+60) → Mítico (+80), com gemas + essências; cada estágio multiplica o bônus do item (×1,15 / ×1,3 / ×1,5 / ×1,75) e melhora a chance da passiva","feito":true},{"nome":"Greed: MODIFICAR equipamentos — 1 passiva por equipamento, separada do fortalecer (fortalecer = bônus base; passiva = % de uma coisa específica), com raridade (Comum a Mítico): Queimadura (dano contínuo 3 s), Quebra-Escudo (dano a escudo), Caçador de Chefes (dano em chefe), Afiado (dano), Certeiro (crítico), Ligeiro (velocidade), Olho de Águia (alcance), Golpe Final (especial), Ganância (+moedas da equipe); se já tinha, escolhe ficar com a nova ou manter a antiga. O Poder não evolui nem ganha passiva","feito":true},{"nome":"FORTALECER = só dano base em todo item (poder e equipamento): +1% de dano por nível e marcos +30/+60/+99 dão +5/+10/+15% de dano extra. Velocidade, alcance, crítico e especial agora só vêm das passivas","feito":true},{"nome":"Cantinhos do jardim (forja, escritório da Selner, chá da Echidna) virados pro centro/torre, casas ×1,8 maiores, NPCs e móveis ×1,5 (NPC = 7,5 studs, 1,5× o jogador; modelos padrão em UnitModels também) e sebe da frente aberta pra entrar","feito":true},{"nome":"Chefes com ESCUDO (35% da vida, barra azul por cima da vida) no mundo e no evento de defesa — apanha antes da vida; inimigo queimando pega fogo","feito":true},{"nome":"Modelo da Norma Selner — opção 2: chapéu bege enorme com laço, cabelão cacheado, terninho bege de saia longa, gravata-laço azul","feito":true},{"nome":"Cantinho da Selner no jardim — opção 5: escritório do Bureau (pérgola, escrivaninha, abajur, arquivo, globo de cristal)","feito":true},{"nome":"Sistema de passivas da Selner (prompt \"Passivas\"): 1 vaga por campeão (a Marca da Bruxa abre mais, até 4); ROLAR = 40 gemas; 14 passivas com raridade própria — Comum 45% (Vigor, Agilidade, Visão), Raro 30% (Fúria, Ímpeto, Precisão), Épico 17,5% (Caçador Rank S, Rajada de Mana, Chamas Negras), Lendário 6% (Monarca, Quebra-Limite, Destruidor), Mítico 1,5% (Soberano das Sombras, Ganância Absoluta); Lendária garantida a cada 40 rolagens; nova × antiga igual à forja","feito":true},{"nome":"Modelo da Echidna — opção 2: com a xícara de chá (cabelo branco, borboleta, vestido preto de listras)","feito":true},{"nome":"Mesa de chá da Echidna no jardim (guarda-sol, atril com livro, vasos)","feito":true},{"nome":"Livro da Sabedoria (Echidna): ver inimigos e chefes, pegar recompensa por completar páginas","feito":false},{"nome":"Renascer o campeão (Echidna): proposta — campeão no nível máximo volta pro 1 e ganha a Marca da Bruxa (+dano permanente e +1 vaga de passiva da Selner por renascer, até 3)","feito":false}]},{"titulo":"Revisar as 13 unidades","descricao":"Rosto com expressão (como o Goku SS3 ganhou), detalhes que faltam e pose. Começa pelos Lendários.","itens":[{"nome":"Kakaroto Saiyajin","feito":true},{"nome":"Ninja Laranja","feito":false},{"nome":"Capitão de Borracha","feito":false},{"nome":"Caçador de Três Espadas","feito":false},{"nome":"Professor Vendado","feito":false},{"nome":"Príncipe Saiyajin","feito":false},{"nome":"Caçador do Haori Xadrez","feito":false},{"nome":"Vingador do Raio","feito":false},{"nome":"Ceifador Substituto","feito":false},{"nome":"Capitão das Pétalas","feito":false},{"nome":"Capitão do Gelo","feito":false},{"nome":"Arqueiro Quincy","feito":false},{"nome":"Ceifador Novato","feito":false}]},{"titulo":"Despertar pra cada unidade","descricao":"Cada despertar: modelo novo + golpe especial novo, pago com Cristais de Despertar do evento de defesa.","itens":[{" <script>
// Movimentos e golpes no 3D da ficha de cada personagem (os botões embaixo do boneco).
// É cópia do jogo (F:\padrao\anime-td\src\StarterPlayer\StarterPlayerScripts):
//   corpo   = UnitAnim.client.luau (parado, andar, estilos de golpe, poses dos especiais, pulo)
//   efeitos = AttackFx.client.luau (bola de ki, socos, Kamehamehas, Genki Dama, dragão, cortes...)
// O visualizador (V3, no app.js) chama controlador.passo(dt, api) a cada quadro e aplica a pose
// que ele devolve; `api` dá a posição das peças, põe coisas na cena, faz o pulo e a câmera de lado.
// Mudou golpe no jogo? Mudar aqui também (mesmos números).
"use strict";
const GOLPES3D = (() => {
  const W = (2 * Math.PI) / 3; // uma volta em 3 s (parado do Kakaroto)
  const sn = (t, k, ph = 0) => Math.sin(W * k * t + ph);
  const lerp = (a, b, t) => a + (b - a) * t;
  function curve(keys, p) { // curva por trechos suavizada (igual ao UnitAnim)
    for (let i = 1; i < keys.length; i++) {
      if (p <= keys[i][0]) {
        const a = keys[i - 1], b = keys[i];
        let t = (p - a[0]) / (b[0] - a[0]);
        t = t * t * (3 - 2 * t);
        return lerp(a[1], b[1], t);
      }
    }
    return keys[keys.length - 1][1];
  }
  const S = (p) => Math.sin(p * Math.PI);

  // ---------------------------------------------------------------- corpo (UnitAnim)
  // golpe: duração e pose(p) -> { corpo: [pitch, yaw], BracoE/BracoD/PernaE/PernaD: [pitch, yaw, roll] }
  const STYLES = {
    Soco: { time: 0.35, pose: (p) => ({ corpo: [-12 * S(p), 6 * S(p)], BracoD: [80 * S(p), 20 * S(p), 0], BracoE: [-15 * S(p), 0, 0] }) },
    Rajada: { time: 0.42, pose: (p) => {
      const r = Math.sin(Math.PI * Math.min(p * 2, 1)), l = Math.sin(Math.PI * Math.max(p * 2 - 1, 0));
      return { corpo: [-8 * (r + l), 10 * r - 10 * l], BracoD: [88 * r, 15 * r, 0], BracoE: [88 * l, 15 * l, 0] };
    } },
    Arremesso: { time: 0.45, pose: (p) => ({
      corpo: [curve([[0, 0], [0.35, 6], [0.65, -15], [1, 0]], p), 0],
      BracoD: [curve([[0, 0], [0.35, 200], [0.65, 60], [1, 0]], p), 0, 0], BracoE: [30 * S(p), 0, 0] }) },
    Aponta: { time: 0.35, pose: (p) => ({ corpo: [3 * S(p), 0], BracoD: [125 * S(p), 10 * S(p), 0], BracoE: [0, 0, 0] }) },
    Corte: { time: 0.45, pose: (p) => ({
      corpo: [curve([[0, 0], [0.3, 4], [0.6, -14], [1, 0]], p), curve([[0, 0], [0.3, 18], [0.6, -18], [1, 0]], p)],
      BracoD: [curve([[0, 0], [0.3, 175], [0.6, 25], [1, 0]], p), 25, 0], BracoE: [40 * S(p), 0, 0] }) },
    BracosAbertos: { time: 0.32, pose: (p) => ({ corpo: [-5 * S(p), 0], BracoD: [20 * S(p), 0, 85 * S(p)], BracoE: [20 * S(p), 0, 85 * S(p)] }) },
    Arco: { time: 0.35, pose: (p) => {
      const hold = S(p), pull = curve([[0, 0], [0.55, 1], [0.7, 0.2], [1, 0]], p);
      return { corpo: [-4 * hold, -12 * hold], BracoE: [90 * hold, 10 * hold, 0], BracoD: [90 * pull, -25 * pull, 0] };
    } },
    Socos: { time: 0.6, pose: (p) => { // 4 socos alternados (combo do Kakaroto)
      const k = p * 4, i = Math.min(Math.floor(k), 3), s = Math.sin(Math.PI * (k - i)), dir = i % 2 === 0;
      const env = Math.pow(S(p), 0.3);
      return {
        corpo: [-10 * env, (dir ? -14 : 14) * s],
        BracoD: dir ? [40 + 52 * s, 20, 0] : [60 * env, 35, 0],
        BracoE: dir ? [60 * env, 35, 0] : [40 + 52 * s, 20, 0],
        PernaE: [18 * env, 0, 6], PernaD: [-14 * env, 0, 6],
      };
    } },
    KiForte: { time: 0.35, pose: (p) => {
      const s = curve([[0, 0], [0.3, 1], [0.75, 1], [1, 0]], p);
      return { corpo: [-10 * s, -18 * s], BracoD: [92 * s, 8 * s, 0], BracoE: [30 * s, 30 * s, 0], PernaE: [16 * s, 0, 4], PernaD: [-16 * s, 0, 4] };
    } },
    Chute: { time: 0.4, pose: (p) => ({ corpo: [12 * S(p), -8 * S(p)], PernaD: [95 * S(p), 0, 0], PernaE: [-10 * S(p), 0, 0], BracoE: [60 * S(p), 25 * S(p), 0], BracoD: [-35 * S(p), 0, 0] }) },
  };
  const IDLE = {
    Guarda: (t) => ({ sobe: sn(t, 2) * 0.03, corpo: [-6 + sn(t, 2) * 1.5, 24],
      BracoE: [98 + sn(t, 2) * 3, 30, 6], BracoD: [70 + sn(t, 2, 0.6) * 3, 42, 8], PernaE: [16, 0, 7], PernaD: [-16, 0, 7] }),
    Ki: (t) => ({ sobe: sn(t, 2) * 0.03, corpo: [-7 + sn(t, 16) * 0.8, 0],
      BracoE: [-12 + sn(t, 20) * 1.5, 0, 26], BracoD: [-12 + sn(t, 20, 2) * 1.5, 0, 26], PernaE: [0, 0, 14], PernaD: [0, 0, 14] }),
  };
  const IDLES = { Saiyajin: (t, ph) => ((t + ph * 3) % 10 >= 8 ? IDLE.Ki(t) : IDLE.Guarda(t)) };
  const WALKS = {
    Natural: (f) => { const s = Math.sin(f); return { sobe: Math.cos(2 * f) * 0.04, corpo: [-4, -s * 9], PernaE: [s * 34, 0, 2], PernaD: [-s * 34, 0, 2], BracoE: [-s * 30, 0, 5], BracoD: [s * 30, 0, 5] }; },
    Padrao: (f) => { const s = Math.sin(f); return { corpo: [-3, 0], PernaE: [s * 34, 0, 0], PernaD: [-s * 34, 0, 0], BracoE: [-s * 26, 0, 0], BracoD: [s * 26, 0, 0] }; },
  };
  // poses seguradas nos especiais: membro = [guinada, giro, roll]; corpo = [pitch, yaw]
  const POSES = {
    Kame: { BracoE: [35, 90], BracoD: [35, 90], corpo: [-8, 0] },
    KameCarga: { BracoE: [70, 20, 0], BracoD: [15, -30, 0], corpo: [4, 28] },
    MaoD: { BracoD: [15, 85] },
    Genki: { BracoE: [0, 160, 30], BracoD: [0, 160, 30], corpo: [8, 0] },
    GenkiJoga: { BracoE: [12, 115, 0], BracoD: [12, 115, 0], corpo: [-14, 0] },
  };
  const NO_AR = { PernaE: [34, 0, 8], PernaD: [-12, 0, 8] };
  const LIMBS = ["BracoE", "BracoD", "PernaE", "PernaD"];
  const PASSO_HZ = 0.55 + 16 * 0.045; // ritmo da passada andando junto com o jogador (16 studs/s)

  // ---------------------------------------------------------------- cores (AttackFx)
  const KI = "#78d2ff", CORE = "#ebfaff", GENKI = "#46a0ff", BRANCO = "#ffffff";
  const DRAGAO_VERDE = "#37a54b", DRAGAO_ESCURO = "#237837", DRAGAO_CLARO = "#ebdca0";
  const KAME_COR = { Kamehameha: [KI, CORE], KameMini: [KI, CORE], KamehamehaSS3: ["#3c96ff", "#fffac8"], KamehamehaSS4: ["#ff2846", "#ffe1eb"] };

  // ---------------------------------------------------------------- controlador
  function controlador(u, forma) {
    const unitStyle = STYLES[u.AnimAtk] || STYLES.Soco;
    const idleFn = IDLES[u.AnimIdle] || null, walkFn = WALKS[u.AnimWalk] || WALKS.Padrao;
    const st = { t: 0, phase: Math.random() * 6, modo: "parado", luta: false, atk: null, pose: null, noAr: false, jump: null,
      wa: 0, wf: 0, cur: {}, curCorpo: null, fx: [], timers: [], gen: 0, ocupado: false, api: null, alvo: null, boneco: null };
    let T; // THREE

    // relógio próprio (para quando a aba some): espera(s) e efeitos por quadro
    const espera = (s) => new Promise((res) => st.timers.push({ at: st.t + s, res }));
    function anima(dur, fn) { // fn(a) com a de 0 a 1; devolve promessa do fim
      return new Promise((res) => {
        let e = 0;
        st.fx.push((dt) => { e += dt; const a = Math.min(e / dur, 1); fn(a); if (a >= 1) { res(); return false; } return true; });
      });
    }
    const vivo = (g) => g === st.gen;

    // ---- peças de efeito
    const objs = new Set(); // tudo que os golpes puseram na cena (sai junto se apertar Parado no meio)
    function poe(o) { objs.add(o); return st.api.add(o); }
    function sai(o) { objs.delete(o); st.api.remove(o); }
    function mat(cor, opac = 1) { return new T.MeshBasicMaterial({ color: cor, transparent: true, opacity: opac, depthWrite: opac > 0.95 }); }
    function bola(pos, diam, cor, opac = 0.95) {
      const m = new T.Mesh(new T.SphereGeometry(0.5, 20, 14), mat(cor, opac));
      m.position.copy(pos); m.scale.setScalar(diam); return poe(m);
    }
    function caixa(size, cor, opac = 1) {
      const m = new T.Mesh(new T.BoxGeometry(size[0], size[1], size[2]), mat(cor, opac));
      return poe(m);
    }
    function tira(m) { sai(m); m.geometry.dispose(); m.material.dispose(); }
    function burst(pos, size, cor) {
      const b = bola(pos, size * 0.3, cor, 0.9);
      anima(0.3, (a) => { b.scale.setScalar(size * (0.3 + 0.7 * a)); b.material.opacity = 0.9 * (1 - a); }).then(() => tira(b));
    }
    function ring(pos, radius, cor, time = 0.25, y) {
      const r = new T.Mesh(new T.CylinderGeometry(1, 1, 0.15, 32, 1, true), mat(cor, 0.7));
      r.material.side = T.DoubleSide;
      r.position.set(pos.x, y ?? pos.y, pos.z); poe(r);
      anima(time, (a) => { const k = 0.5 + (radius - 0.5) * a; r.scale.set(k, 1, k); r.material.opacity = 0.7 * (1 - a); }).then(() => tira(r));
    }
    // cilindro de `a` até `b` (o do three.js fica em pé: gira pra apontar)
    const Y = () => new T.Vector3(0, 1, 0);
    function haste(a, b, w, cor, opac) {
      const m = new T.Mesh(new T.CylinderGeometry(0.5, 0.5, 1, 18), mat(cor, opac));
      poe(m); poeHaste(m, a, b, w); return m;
    }
    function poeHaste(m, a, b, w) {
      const d = new T.Vector3().subVectors(b, a), len = Math.max(d.length(), 0.01);
      m.position.copy(a).addScaledVector(d, 0.5);
      m.quaternion.setFromUnitVectors(Y(), d.clone().normalize());
      m.scale.set(w, len, w);
    }

    // ---- alvo: boneco de treino na frente (-Z)
    function poeBoneco() {
      const api = st.api, k = Math.min(1.3, Math.max(0.8, api.sz.y / 4));
      const D = 10 + api.sz.z * 0.5; // longe o bastante pro feixe e pra bola caberem
      const g = new T.Group();
      const add = (s, y, cor) => { const m = new T.Mesh(new T.BoxGeometry(s[0] * k, s[1] * k, s[2] * k), new T.MeshLambertMaterial({ color: cor })); m.position.y = y * k; g.add(m); return m; };
      add([1.3, 0.2, 1.3], 0.1, "#6b4a2b"); add([0.3, 2.4, 0.3], 1.3, "#a8743f");
      add([1.0, 1.1, 0.6], 2.05, "#d8b169"); add([1.9, 0.22, 0.22], 2.35, "#a8743f"); add([0.7, 0.7, 0.7], 2.95, "#d8b169");
      const alvoMark = add([0.5, 0.5, 0.05], 2.05, "#e0463c"); alvoMark.position.z = 0.33 * k; // "frente" do boneco olha pro personagem

    }
    function apanha() { // o boneco balança quando leva o golpe
      const g = st.boneco; if (!g) return;
      anima(0.35, (a) => { g.rotation.x = Math.sin(a * Math.PI * 3) * 0.18 * (1 - a); });
    }
    function entraLuta() {
      if (st.luta) return;
      st.luta = true; st.modo = "parado"; poeBoneco(); st.api.luta(true, st.D);

    // ---- pontos do corpo
    const V = (x, y, z) => new T.Vector3(x, y, z);
    function grupoPos() { return st.api.grupo().position.clone(); }
    function mao(nome = "PunhoD") { return st.api.ponto(nome) || st.api.ponto(nome.replace("Punho", "Mao")) || st.api.ponto("Head") || V(0, 2, -0.5); }
    function peito() { // mãos juntas na frente do peito (igual ao chestPos do jogo)
      const t = st.api.rig && st.api.rig.torso;
      const p = t ? V(t[2][0], t[2][1] + 0.1, t[2][2] - t[4][2] / 2 - 0.6) : V(0, 1.6, -0.8);
      return p.add(grupoPos());
    }
    function topoCabeca() { const h = st.api.ponto("Head"), s = st.api.tamanho("Head"); return h ? h.add(V(0, (s ? s.y / 2 : 0.5) + 1, 0)) : V(0, 4, 0); }
    function ombro(lado) { const p = st.api.rig && st.api.rig.piv["arm" + lado]; return p ? p.clone().add(grupoPos()) : V(lado === "D" ? -0.7 : 0.7, 1.9, 0); }
    function linhaAte(from, extra = 7) { const d = st.alvo.clone().sub(from); return from.clone().addScaledVector(d.normalize(), from.distanceTo(st.alvo) + extra); } // feixe passa do alvo, como no jogo
    function pele() { const r = st.api.rig && st.api.rig.recs.find((x) => x.nome === "BracoD" || x.nome === "Head"); return r ? r.p[5] : "#ffceaa"; }
    function escondeBracos(lados, on) { st.api.malhas((n) => lados.some((l) => n === "Braco" + l || n === "Punho" + l || n === "Mao" + l)).forEach((m) => { m.visible = !on; }); }

    // ---- golpe: marca o estilo do corpo (o jogo usa o nome do golpe; senão o do personagem)
    function golpe(nome) { st.atk = { style: STYLES[nome] || unitStyle, t0: st.t }; }
    function pula(h, dur) { st.jump = { t0: st.t, h, dur }; st.noAr = true; }

    // ---- efeitos (AttackFx)
    async function kiBlast(from, to, cor = KI, size = 0.9) {
      const b = bola(from, size, cor);
      await anima(0.15, (a) => b.position.lerpVectors(from, to, a));
      tira(b); burst(to, 3 * size / 0.9, cor); apanha();
    }
    async function feixe(nome, from, to, charge, width, hold = 0.4, poseCarga, poseTiro, cores, extra) {
      const g = st.gen;
      const [cor, core] = cores || KAME_COR[nome] || [KI, CORE];
      if (poseCarga) st.pose = poseCarga;
      const b = bola(from, 0.3, cor, 0.9), c = bola(from, 0.15, core, 1);
      await anima(charge, (a) => { const e = Math.sin(a * Math.PI / 2); b.scale.setScalar(0.3 + (width * 0.75 - 0.3) * e); c.scale.setScalar(0.15 + (width * 0.4 - 0.15) * e); });
      if (!vivo(g)) { tira(b); tira(c); return; }
      if (poseTiro) st.pose = poseTiro;
      const outer = haste(from, from, width, cor, 0.75), inner = haste(from, from, width * 0.45, core, 1);
      await anima(0.15, (a) => { const p = from.clone().lerp(to, a); poeHaste(outer, from, p, width); poeHaste(inner, from, p, width * 0.45); b.position.copy(p); c.position.copy(p); b.scale.setScalar(width * (0.75 + 0.35 * a)); });
      tira(b); tira(c); burst(to, width * 3, cor); apanha();
      if (extra) extra(from, to, width, hold);
      if (hold > 0.5) { // feixe longo: pulsa e solta estouros no fim da linha
        let tick = 0;
        await anima(hold, (a) => {
          const w = width * (1 + Math.sin(a * hold * 30) * 0.08);
          poeHaste(outer, from, to, w); poeHaste(inner, from, to, w * 0.45);
          if (a * hold > tick) { tick += 0.25; burst(to.clone().add(V(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(width)), width * 1.6, cor); apanha(); }
        });
      } else await espera(hold);
      await anima(0.25, (a) => { poeHaste(outer, from, to, width * (1 - a) + 0.05); poeHaste(inner, from, to, width * 0.45 * (1 - a) + 0.05); outer.material.opacity = 0.75 * (1 - a); inner.material.opacity = 1 - a; });
      tira(outer); tira(inner);
      if (vivo(g)) st.pose = null;
    }
    // dragão de blocos (lembra o Shenlong) enrolado no feixe do SS4
    async function dragao(from, to, width, hold) {
      const look = new T.Matrix4().lookAt(from, to, Y()), len = from.distanceTo(to), R = width * 0.85, n = 20;
      const ax = V(1, 0, 0).applyMatrix4(look), ay = V(0, 1, 0).applyMatrix4(look), az = V(0, 0, -1).applyMatrix4(new T.Matrix4().extractRotation(look));
      const segs = [];
      for (let i = 0; i < n; i++) { const s = width * 0.42 * (1 - (i / n) * 0.6); segs.push(caixa([s, s, s], i % 2 ? DRAGAO_ESCURO : DRAGAO_VERDE)); }
      const hs = width * 0.55, head = new T.Group(); poe(head);
      const peca = (s, pos, cor, rx = 0, ry = 0) => { const m = new T.Mesh(new T.BoxGeometry(...s), mat(cor)); m.position.set(...pos); m.rotation.set(rx, ry, 0); head.add(m); };
      peca([hs, hs * 0.8, hs * 1.1], [0, 0, 0], DRAGAO_VERDE);
      peca([hs * 0.7, hs * 0.45, hs * 0.6], [0, -hs * 0.1, -hs * 0.8], DRAGAO_VERDE);
      peca([hs * 0.15, hs * 0.15, hs * 0.9], [-hs * 0.3, hs * 0.55, hs * 0.5], DRAGAO_CLARO, 0.5);
      peca([hs * 0.15, hs * 0.15, hs * 0.9], [hs * 0.3, hs * 0.55, hs * 0.5], DRAGAO_CLARO, 0.5);
      peca([hs * 0.18, hs * 0.18, hs * 0.18], [-hs * 0.42, hs * 0.15, -hs * 0.3], "#ff1e1e");
      peca([hs * 0.18, hs * 0.18, hs * 0.18], [hs * 0.42, hs * 0.15, -hs * 0.3], "#ff1e1e");
      peca([hs * 0.06, hs * 0.06, hs * 1.6], [-hs * 0.45, -hs * 0.2, -hs * 0.2], DRAGAO_CLARO, 0, -0.6);
      peca([hs * 0.06, hs * 0.06, hs * 1.6], [hs * 0.45, -hs * 0.2, -hs * 0.2], DRAGAO_CLARO, 0, 0.6);
      const at = (u) => { const th = u * Math.PI * 5; return from.clone().addScaledVector(ax, Math.cos(th) * R).addScaledVector(ay, Math.sin(th) * R).addScaledVector(az, u * len); };
      const olha = (obj, u) => { const p = at(u), q = at(Math.min(u + 0.01, 1) + 1e-4); obj.position.copy(p); obj.lookAt(q.distanceTo(p) > 1e-3 ? q : p.clone().add(az)); obj.rotateY(Math.PI); };
      await anima(hold * 0.8, (a) => {
        const uh = a * 1.15;
        segs.forEach((s, i) => olha(s, Math.min(Math.max(uh - (i + 1) * 0.035, 0), 1)));
        olha(head, Math.min(uh, 1));
      });
      await anima(0.35, (a) => { segs.forEach((s) => { s.material.opacity = 1 - a; }); head.children.forEach((m) => { m.material.transparent = true; m.material.opacity = 1 - a; }); });
      segs.forEach(tira); sai(head);
    }
    async function genki(top, to, charge, radius) {
      const g = st.gen, maxD = radius * 1.1;
      st.pose = "Genki";
      const b = bola(top, 0.5, GENKI, 0.65), c = bola(top, 0.3, CORE, 1);
      let center = top.clone(), prox = 0;
      await anima(charge, (a) => {
        const d = 0.5 + (maxD - 0.5) * a;
        center = top.clone().add(V(0, d / 2, 0));
        b.scale.setScalar(d); b.position.copy(center); c.scale.setScalar(d * 0.4 * (1 + Math.sin(a * 40) * 0.05)); c.position.copy(center);
        if (a < 0.9 && st.t > prox) { // pedacinhos de energia chegando de todo lado
          prox = st.t + 0.03;
          const ang = Math.random() * Math.PI * 2, dist = 18 + Math.random() * 10;
          const p0 = center.clone().add(V(Math.cos(ang) * dist, Math.random() * 10 - 2, Math.sin(ang) * dist));
          const bit = caixa([0.35, 0.35, 0.35], Math.random() < 0.5 ? GENKI : CORE); bit.position.copy(p0);
          const alvo = center.clone();
          anima(0.45, (k) => { bit.position.lerpVectors(p0, alvo, k * k); bit.scale.setScalar(1 - 0.7 * k); }).then(() => tira(bit));
        }
      });
      if (!vivo(g)) { tira(b); tira(c); return; }
      st.pose = "GenkiJoga";
      const mid = center.clone().lerp(to, 0.5).add(V(0, 3, 0)), ini = center.clone();
      await anima(0.55, (a) => { const e = a * a; const p = ini.clone().lerp(mid, e).lerp(mid.clone().lerp(to, e), e); b.position.copy(p); c.position.copy(p); });
      tira(b); tira(c);
      const dome = bola(to, maxD, GENKI, 0.9);
      anima(0.6, (a) => { dome.scale.setScalar(maxD + (radius * 2.4 - maxD) * a); dome.material.opacity = 0.9 * (1 - a); }).then(() => tira(dome));
      ring(to, radius * 1.3, BRANCO, 0.4, 0.2); espera(0.12).then(() => ring(to, radius * 1.7, GENKI, 0.5, 0.4));
      burst(to, radius * 1.2, CORE); apanha();
      await espera(0.3);
      if (vivo(g)) st.pose = null;
    }
    function socosFx(to, hits, time) {
      for (let i = 1; i <= hits; i++) espera((time * (i - 0.5)) / hits).then(() => { burst(to.clone().add(V((Math.random() - 0.5) * 1.6, Math.random() * 1.2, 0.3)), 1.6, BRANCO); apanha(); });
      espera(time).then(() => ring(to, 3, BRANCO, 0.25, 0.3));
      return espera(time);
    }
    function streak(pos) {
      burst(pos, 3, BRANCO);
      for (let k = 0; k < 4; k++) {
        const o = pos.clone().add(V((Math.random() - 0.5) * 2, 0, (Math.random() - 0.5) * 2));
        const l = caixa([0.12, 4.5, 0.12], BRANCO, 0.8); l.position.copy(o);
        anima(0.25, (a) => { l.position.y = o.y + 2 * a; l.scale.set(1 - 0.8 * a, 1 + 0.55 * a, 1 - 0.8 * a); l.material.opacity = 0.8 * (1 - a); }).then(() => tira(l));
      }
    }
    async function estica(shoulder, to, cor, time) { // braço de borracha: sai do ombro, vai e volta
      const arm = caixa([0.32, 0.32, 1], cor), fist = caixa([0.55, 0.55, 0.55], cor);
      const poe = (k) => { const tip = shoulder.clone().lerp(to, k); poeHaste(arm, shoulder, tip, 0.32); fist.position.copy(tip); };
      await anima(time, poe); burst(to, 1.4, BRANCO); apanha();
      await anima(time, (a) => poe(1 - a));
      tira(arm); tira(fist);
    }
    async function meiaLua(from, to, span, cor, borda, time) {
      const g = new T.Group(); poe(g);
      for (let i = 0; i < 9; i++) {
        const a = (-75 + i * (150 / 8)) * Math.PI / 180;
        const m = new T.Mesh(new T.BoxGeometry(span * 0.2, span * 0.12, span * 0.12), mat(i % 2 ? borda : cor, 0.9));
        m.position.set(Math.sin(a) * span * 0.5, 0, -(Math.cos(a) * span * 0.25 - span * 0.25)); m.rotation.y = a; g.add(m);
      }
      const dir = new T.Vector3().subVectors(to, from);
      g.position.copy(from); g.lookAt(to); g.rotateY(Math.PI);
      await anima(time, (a) => { g.position.copy(from).addScaledVector(dir, a); g.children.forEach((m) => { m.material.opacity = 0.9 - 0.4 * a; }); });
      sai(g);
    }

    // ---- botões
    const sp = forma.special || u.Special;
    const corU = u.Color || "#ffffff";
    const tituloEsp = (sp && (sp.Title || (forma.especialTxt && forma.especialTxt.nome))) || (sp ? sp.Name : "");
    async function especial() {
      const g = st.gen;
      if (!sp) return;
      golpe(sp.Name);
      const lift = sp.Jump || 0;
      if (sp.Name === "GenkiDama") {
        const top = topoCabeca().add(V(0, lift, 0));
        if (lift) pula(lift, sp.Charge + 0.55 + 0.4);
        await genki(top, st.alvo.clone(), sp.Charge, sp.Radius || 9);
      } else if (KAME_COR[sp.Name]) {
        const from = peito().add(V(0, lift, 0)), hold = sp.Hold || 0.4;
        if (lift) pula(lift, sp.Charge + 0.15 + hold + 0.25 + 0.35);
        await feixe(sp.Name, from, linhaAte(from), sp.Charge, sp.Width, hold, "KameCarga", "Kame", null, sp.Name === "KamehamehaSS4" ? dragao : null);
      } else if (sp.Name === "Metralhadora") {
        escondeBracos(["E", "D"], true);
        const n = 12, ombros = [ombro("E"), ombro("D")], cor = pele();
        for (let i = 0; i < n && vivo(g); i++) {
          const spot = st.alvo.clone().add(V((Math.random() - 0.5) * 2.2, (Math.random() - 0.5) * 1.6, 0.4));
          estica(ombros[i % 2], spot, cor, 0.06);
          await espera((sp.Duration || 0.8) / n);
        }
        await espera(0.15); ring(st.alvo, 2.4, BRANCO, 0.3, 0.3); escondeBracos(["E", "D"], false);
      } else if (sp.Name === "GetsugaTenshou" || sp.Name === "GetsugaNegro") {
        const negro = sp.Name === "GetsugaNegro", preto = negro ? "#0f080c" : "#140a14", verm = negro ? "#e61423" : "#e61e28";
        const from = mao(), w = sp.Width || 4;
        const a1 = bola(from, 0.5, preto, 0.85), a2 = bola(from, 0.6, verm, 0.4);
        await anima(sp.Charge || 0.5, (a) => { a1.scale.setScalar(0.5 + w * 0.8 * a); a2.scale.setScalar(0.6 + w * a); a1.position.copy(mao()); a2.position.copy(mao()); });
        tira(a1); tira(a2);
        const to = linhaAte(from, 6);
        if (negro) { meiaLua(from, to, w * 2.4, preto, verm, 0.3); await espera(0.08); await meiaLua(from.clone().add(V(0, 0.6, 0)), to.clone().add(V(0, 0.6, 0)), w * 1.8, verm, preto, 0.28); }
        else await meiaLua(from, to, w * 2.2, preto, verm, 0.3);
        burst(st.alvo, w * 3, verm); ring(st.alvo, w * 1.4, preto, 0.35, 0.3); apanha();
      } else if (sp.Width) { // especial em linha genérico: feixe na cor do personagem
        const from = mao();
        await feixe(sp.Name, from, linhaAte(from), sp.Charge || 0.5, sp.Width, 0.4, "MaoD", "MaoD", [corU, BRANCO]);
      } else { // em área genérico: estouros no alvo durante a duração
        const dur = sp.Duration || 0.8, r = sp.Radius || 3;
        for (let i = 0; i < 6 && vivo(g); i++) { burst(st.alvo.clone().add(V((Math.random() - 0.5) * r, (Math.random() - 0.5), (Math.random() - 0.5) * r * 0.5)), 2, corU); apanha(); await espera(dur / 6); }
        ring(st.alvo, r, corU, 0.35, 0.3);
      }
    }
    async function golpeNormal() {
      const g = st.gen;
      if (u.Fx === "Borracha") { // soco esticado do Capitão de Borracha
        golpe("Soco"); escondeBracos(["D"], true);
        await estica(ombro("D"), st.alvo.clone(), pele(), 0.12);
        ring(st.alvo, 2, BRANCO, 0.25, 0.3); escondeBracos(["D"], false);
      } else if (u.Fx === "Getsuga") { // corte em onda
        golpe("CorteOnda"); await espera(0.15); if (!vivo(g)) return;
        const from = mao(); await meiaLua(from, st.alvo.clone(), 2.4, "#bee6ff", BRANCO, 0.2);
        burst(st.alvo, 2.4, "#bee6ff"); apanha();
      } else { // bola de energia na cor do personagem (ki, shuriken, flecha...)
        golpe(u.Fx || "Golpe"); await espera(0.1); if (!vivo(g)) return;
        await kiBlast(mao(), st.alvo.clone(), u.Fx === "Ki" ? KI : corU, 0.9);
      }
    }
    const combo = {
      socos: async () => { golpe("Socos"); await socosFx(st.alvo.clone(), 4, 0.6); },
      ki: async () => { golpe("KiForte"); await espera(0.08); await kiBlast(mao(), st.alvo.clone(), KI, 1.5); },
      kame: async () => { golpe("KameMini"); const from = peito(); await feixe("KameMini", from, linhaAte(from), 0.35, 1.8, 0.4, "KameCarga", "Kame"); },
    };
    async function teleporte() {
      const g = st.gen, perto = -(st.D - 2.3);
      streak(peito()); st.api.desloca(perto); streak(peito());
      await espera(0.25); if (!vivo(g)) return;
      await combo.socos(); await espera(0.6); if (!vivo(g)) return;
      streak(peito()); st.api.desloca(0); streak(peito());
    }
    // roda um golpe: entra na vista de luta, um de cada vez
    const roda = (fn) => async () => {
      if (st.ocupado) return;
      entraLuta(); st.ocupado = true;
      const g = st.gen;
      try { await fn(); await espera(0.2); } finally { if (vivo(g)) st.ocupado = false; }
    };
    function botoes() {
      const lista = [];
      if (u.Combo) {
        lista.push({ id: "socos", nome: "1 · Socos", run: roda(combo.socos) });
        lista.push({ id: "ki", nome: "2 · Golpe de ki", run: roda(combo.ki) });
        lista.push({ id: "kame", nome: "3 · Kamehameha pequeno", run: roda(combo.kame) });
      } else lista.push({ id: "golpe", nome: u.Fx === "Borracha" ? "Soco esticado" : u.Fx === "Getsuga" ? "Corte em onda" : "Golpe normal", run: roda(golpeNormal) });
      if (sp) lista.push({ id: "especial", nome: "Especial · " + tituloEsp, run: roda(especial), destaque: true });
      if (u.Combo) lista.push({ id: "combo", nome: "Combo completo", run: roda(async () => {
        const g = st.gen;
        await combo.socos(); await espera(1); if (!vivo(g)) return;
        await combo.ki(); await espera(1); if (!vivo(g)) return;
        await combo.kame(); await espera(1.2); if (!vivo(g)) return;
        await especial();
      }) });
      if (forma.f && forma.f.Teleporte) lista.push({ id: "teleporte", nome: "Teletransporte", run: roda(teleporte) });
      return lista;
    }

    function zera() { for (const o of objs) st.api && st.api.remove(o); objs.clear(); st.atk = null; st.pose = null; st.noAr = false; st.jump = null; st.fx = []; st.timers = []; st.gen++; st.ocupado = false; }
    return {
      botoes,
      parado() { zera(); st.modo = "parado"; if (st.luta) { st.luta = false; if (st.boneco) sai(st.boneco); st.boneco = null; st.api.altura(0); st.api.desloca(0); st.api.luta(false); } },
      andar() { this.parado(); st.modo = "andar"; },
      comeca(api) { // o V3 chamou (boneco novo, outra forma ou itens): o que estava na cena já saiu
        st.api = api; T = api.THREE; zera(); st.boneco = null;
        api.altura(0); api.desloca(0);
        if (st.luta) { st.luta = false; entraLuta(); }
      },
      passo(dt, api) {
        st.t += dt;
        for (const tm of [...st.timers]) if (st.t >= tm.at) { st.timers.splice(st.timers.indexOf(tm), 1); tm.res(); }
        // efeito que nasce dentro de outro (pedacinhos da Genki, estouros do feixe) entra no próximo quadro
        const corre = st.fx, gen = st.gen; st.fx = [];
        const vivos = corre.filter((f) => f(dt) !== false);
        if (gen === st.gen) st.fx = vivos.concat(st.fx);
        // pulo do especial: sobe rápido, flutua e cai acelerando (igual ao MundoServer)
        let y = 0;
        if (st.jump) {
          const j = st.jump, e = st.t - j.t0;
          if (e >= j.dur) { st.jump = null; st.noAr = false; }
          else if (e < 0.3) y = j.h * (1 - (1 - e / 0.3) ** 2);
          else if (e > j.dur - 0.35) y = j.h * (1 - ((e - (j.dur - 0.35)) / 0.35) ** 2);
          else y = j.h + Math.sin((e - 0.3) * 4) * 0.15;
        }

      const e = Math.sin(Math.PI * k); c.scale.setScalar(0.3 + e); c.material.opacity = Math.min(1, 2 * (1 - k));
    }
    const p = 1 + Math.sin(a.t * 5) * 0.12; a.anel.scale.set(p, 1, p);
  }
  let ultimo = 0;
  function loop(t) {
    if (!rodando) return;
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (t - ultimo) / 1000 || 0); ultimo = t;
    if (auraFx) passoAura(auraFx, dt);
    if (anim && api) {
      const P = anim.passo(dt, api);
      if (P && grupo) aplicaPose(grupo, P);
    }
    controls.update(); renderer.render(scene, camera);
  }
  // O que o controlador de golpes (tools/golpes3d.js) usa: posição das peças agora (já com a pose e o
  // pulo), pôr/tirar coisas da cena, subir o boneco (pulo) e a câmera de lado pra ver o golpe.
  function criaApi(sz) {
    const rig = grupo.userData.rig;
    const porNome = new Map();
    for (const r of rig ? rig.recs : []) if (!porNome.has(r.nome)) porNome.set(r.nome, r);
    return {
      THREE, scene, camera, controls, rig, sz,
      grupo: () => grupo,
      tem: (nome) => porNome.has(nome),
      ponto(nome) { // centro da peça no mundo
        const r = porNome.get(nome);
        if (!r) return null;
        return new THREE.Vector3().setFromMatrixPosition(r.mesh.matrix).add(grupo.position);
      },
      tamanho: (nome) => { const r = porNome.get(nome); return r ? new THREE.Vector3(...r.p[4]) : null; },
      malhas: (filtro) => (rig ? rig.recs.filter((r) => filtro(r.nome)).map((r) => r.mesh) : []),
      add(o) { scene.add(o); extras.add(o); return o; },
      remove(o) { scene.remove(o); extras.delete(o); },
      altura(y) { grupo.position.y = (grupo.userData.baseY || 0) + y; }, // pulo do especial
      desloca(z) { grupo.position.z = z; }, // teletransporte até o alvo
      luta(on, dist) { // câmera de lado mostrando o boneco e o alvo
        controls.autoRotate = false;
        if (!on) { enquadra(grupo); return; }
        // distância pra caber o personagem e o boneco na largura do palco (que às vezes é estreito e alto)
        const midZ = -dist / 2, larg = dist + Math.max(sz.z, sz.x) + 6, alt = Math.max(sz.y + 6, 13);
        const tv = Math.tan((camera.fov * Math.PI) / 360), d = Math.max(larg / 2 / (tv * camera.aspect), alt / 2 / tv) * 1.05;
        const ty = Math.max(sz.y * 0.55 + 1.2, alt * 0.45); // um pouco alto: o especial pula
        camera.position.set(d * 0.96, ty + d * 0.08, midZ + d * 0.26);
        controls.target.set(0, ty, midZ);
        controls.minDistance = d * 0.2; controls.maxDistance = d * 3;
      },
    };
  }
  function enquadra(g, manterCamera) {
    const box = new THREE.Box3().setFromObject(g), c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
    const d = Math.max(sz.x, sz.y * 1.05, sz.z) * 2.1 + 1;
    if (!manterCamera) { camera.position.set(c.x + d * 0.5, c.y + d * 0.18, c.z - d * 0.85); }
    controls.target.copy(c); controls.minDistance = d * 0.25; controls.maxDistance = d * 3;
    return sz;
  }
  return {
    ok,
    mostra(container, id, op = {}) {
      if (!ok || !MOD[id]) { container.innerHTML = `<div class="sem3d">${ok ? "Sem modelo 3D" : "O 3D precisa de internet (three.js)"}</div>`; return; }
      if (!renderer) init();
      const mesmo = alvo === container && op.manterCamera;
      if (alvo !== container) { if (alvo) ro.unobserve(alvo); alvo = container; container.innerHTML = ""; container.appendChild(renderer.domElement); ro.observe(container); }
      if (grupo) scene.remove(grupo);
      grupo = monta(id, op);
      scene.add(grupo);
      const chao = new THREE.Mesh(new THREE.CircleGeometry(1, 40), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.12 }));
      chao.rotation.x = -Math.PI / 2; chao.position.y = 0.01;

      chao.scale.setScalar(Math.max(sz.x, sz.z) * 0.75 + 0.6);
      grupo.add(chao);
      auraFx = aura(op.aura, sz.y);
      if (auraFx) grupo.add(auraFx.anel);
      controls.autoRotate = op.girar !== false;
      tam();
      for (const o of extras) scene.remove(o);
      extras.clear();
      api = criaApi(sz);
      anim = op.anim || null;
      if (anim && anim.comeca) anim.comeca(api);
      if (!rodando) { rodando = true; requestAnimationFrame(loop); }
    },
    api: () => api,
    girar(v) { if (controls) controls.autoRotate = v; },
    estado() { return { scene, camera, controls, grupo, rodando }; }, // pra depurar no console

    para() { rodando = false; if (alvo && ro) ro.unobserve(alvo); alvo = null; },
    foto(id, w = 300, h = 360) { // imagem parada (pra galeria de modelos sem foto do Blender)
      if (!ok || !MOD[id]) return "";
      if (!renderer) init();
      const g = monta(id), sc = new THREE.Scene();
      sc.add(new THREE.HemisphereLight(0xffffff, 0x8a87a0, 0.8)); const l = new THREE.DirectionalLight(0xffffff, 0.5); l.position.set(-6, 10, -8); sc.add(l); sc.add(g);
      const box = new THREE.Box3().setFromObject(g), c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
      const cam = new THREE.PerspectiveCamera(35, w / h, 0.05, 500), d = Math.max(sz.x, sz.y, sz.z) * 2.1 + 0.5;
      cam.position.set(c.x + d * 0.5, c.y + d * 0.25, c.z - d * 0.85); cam.lookAt(c);
      const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); r.setSize(w, h, false);
      r.render(sc, cam); const url = r.domElement.toDataURL(); r.dispose(); r.forceContextLoss();
      return url;
    },
  };
})();
